# The three steps every job that builds needs before it can do anything of its own: Qt, the MSVC
# environment, and a configured tree. The checkout stays in the workflow, because a local action
# is read out of the workspace and there is no workspace until it has been checked out.
#
# One place and not one copy per job, for the reason config/paths.default.json exists: a Qt version and a
# preset name written everywhere is copies that drift. ilammy/msvc-dev-cmd and
# jurplel/install-qt-action both publish what they find through GITHUB_ENV, so what they set
# reaches the calling job's later steps -- which is why a step each in here is enough and nothing
# has to be passed back.
#
# Qt is restored from the Actions cache before install-qt-action is asked to do anything. The
# action's own `cache: true` caches the 344 MB install, but it still runs `pip install aqtinstall`
# and `aqt list-qt` before it looks: the qml job spent 104 s in the action on 2026-10-23, of which
# the cached restore was 12 s (the rest was pip and the wheel builds; the unit job, whose pip was
# warmer, spent 56 s). Restoring here leaves that work to a cache miss, which is a Qt version
# bump. The environment the action would have set is set below on both paths, so a caller sees the
# same variables whether Qt was restored or installed; actions/cache brings back a directory, not
# the values the action derives from it.
#
# The cache path is $RUNNER_WORKSPACE/Qt, which is where install-qt-action installs by default:
# its `dir` input is the parent to which it appends Qt, so passing this path there would nest a
# second Qt (the 2026-10-23 run did, and landed at Qt/Qt/6.9.0). Leave `dir` unset so the install
# and the restore agree. Qt's directory inside that drops the `win64_` prefix of the arch name:
# win64_msvc2022_64 installs to 6.9.0/msvc2022_64.
name: Configure a build tree
description: Restore or install Qt 6.9.0, enter the MSVC environment, and configure build-ninja against the ninja-qt6 preset.

inputs:
  qtVersion:
    description: Qt version, shared by the cache key, the install and the environment.
    default: '6.9.0'
  qtArch:
    description: Qt architecture; the install directory drops its win64_ prefix.
    default: 'win64_msvc2022_64'
  qtModules:
    description: Additional Qt modules, space-separated (install-qt-action splits the input on spaces).
    default: 'qtshadertools qtmultimedia qtspeech'

runs:
  using: composite
  steps:
    - name: Restore Qt
      id: qt
      uses: actions/cache@v6
      with:
        path: ${{ runner.workspace }}/Qt
        key: qt-${{ inputs.qtVersion }}-${{ inputs.qtArch }}-${{ inputs.qtModules }}-${{ runner.os }}

    # The base install carries qtbase (Core, Gui, Widgets, Network, and Test, which is where
    # Qt6Test comes from), qtdeclarative (Quick, and QuickTest, which is built out of its
    # src/qmltest), qtsvg, and qttools (LinguistTools). Three add-ons are not in the base:
    # qtshadertools for the glass shader's qsb (qt_add_shaders in src/app/CMakeLists.txt), and
    # qtmultimedia with qtspeech for the pronunciation duty's QMediaPlayer and QTextToSpeech.
    #
    # Only on a miss. `cache: true` stays on the action as the fallback for the first run after
    # this key changes: it restores the action's own copy of the same install rather than
    # downloading Qt again, and the step below then saves the directory under the key that the
    # next run looks for first.
    - name: Install Qt
      if: steps.qt.outputs.cache-hit != 'true'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qtVersion }}
        arch: ${{ inputs.qtArch }}
        modules: ${{ inputs.qtModules }}
        cache: true

    # Actions/cache restores the files but not the variables, so both paths go through this step;
    # install-qt-action sets the same values on a miss, and repeating them is harmless. Qt's
    # install directory drops the arch's win64_ prefix.
    - name: Qt environment
      shell: pwsh
      run: |
        $root = "$env:RUNNER_WORKSPACE\Qt\${{ inputs.qtVersion }}\msvc2022_64"
        "QT_ROOT_DIR=$root" >> $env:GITHUB_ENV
        "QT_PLUGIN_PATH=$root\plugins" >> $env:GITHUB_ENV
        "QML2_IMPORT_PATH=$root\qml" >> $env:GITHUB_ENV
        "$root\bin" >> $env:GITHUB_PATH

    # Ninja cannot find MSVC by itself -- the same reason scripts/build/build.bat enters the Visual
    # Studio environment before driving CMake. The runner has VS 2022, so nothing installs.
    - uses: ilammy/msvc-dev-cmd@v1

    # The sherpa-onnx runtime the local voices run on (docs/adr/0135). config/paths.default.json names the
    # developer's copy, which a runner does not have, so the job fetches the pinned release, checks its digest,
    # and names the extracted copy in config/paths.local.json -- the override config/README.md gives a machine
    # that differs. The version and digest are the ones third_party/sherpa-onnx/README.md records.
    - name: sherpa-onnx runtime
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        $version = '2.0.1'
        $digest  = 'ce987d5bfca42c74b54f7b3bbaaa8c1febe3c5cd0fea8f94be80ea30e72f1f61'
        $name    = "sherpa-onnx-v$version-win-x64-shared-MD-Release"
        $archive = Join-Path $env:RUNNER_TEMP "$name.tar.bz2"
        Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$version/$name.tar.bz2" -OutFile $archive
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $digest) {
          throw "sherpa-onnx: the downloaded archive does not match the digest this repository pins"
        }
        # CMake's own tar, not `tar`: the runner's tar can be GNU tar from Git, which reads C: as a host name.
        Push-Location $env:RUNNER_TEMP
        cmake -E tar xjf $archive
        $extracted = $LASTEXITCODE
        Pop-Location
        if ($extracted -ne 0) { throw "sherpa-onnx: cmake could not extract the archive" }
        $root = (Join-Path $env:RUNNER_TEMP $name) -replace '\\', '/'
        # WriteAllText writes UTF-8 without a byte-order mark, which string(JSON) in CMake would reject.
        $json = ConvertTo-Json -InputObject @{ sherpaOnnxRoot = $root }
        [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'config/paths.local.json'), $json)

    # The preset bakes in this machine's Qt prefix, which is where config/paths.default.json keeps it for
    # everything else. Override it here with wherever the action put Qt; the rest of the preset is
    # meant to be used as written. `shell` is not optional in a composite action, and pwsh is what
    # the $env: syntax needs.
    - name: Configure
      shell: pwsh
      run: cmake --preset ninja-qt6 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
