# The gate that was missing. lens_gtest_unit has been offline, key-free and CI-ready since it was
# written, but nothing ever ran it -- it held only as long as someone
# remembered to run it by hand.
#
# Five jobs, one concern each, so a red run says what broke instead of naming the one job that
# held everything:
#
#   unit            the offline gtest suite. The cheapest job in the file: it is the only suite
#                   whose build does not pull in the QML module, and the one that runs on every
#                   piece of C++ that can reach it.
#   app             the executable compiles and links, first as it ships and then with the developer
#                   surface, which it smokes in the same tree. main.cpp, the translations and the
#                   icon resources are compiled by no other target, so a break in any of them has
#                   no other job to fail in.
#   qml-components  the QML module and the component suite, with the lint after the build.
#   qml-surfaces    the same module and the surface suite, sharded by case file. It is the gate's
#                   longest step, which is why the component half got a runner of its own: both
#                   jobs build the module, and that duplicate build runs beside the surface suite
#                   rather than ahead of it. The two qml jobs share no state -- setup.cpp names its
#                   settings copy by process id.
#   hygiene         the pre-commit hook's checks, over the files this change touches.
#
# A changes job in front of them reads the changed paths (scripts/quality/ci-changes.sh) and
# skips a job this change cannot affect: a QML-only change leaves the unit suite out, a
# googletest change leaves the app and both qml jobs out, and a config-only change leaves every
# build job out. Hygiene always runs, because it checks the files the change touches.
#
# Coverage is not here. It is report-only, and its two jobs are the longest in the file; running
# them on a red gate spent twenty minutes proving nothing. .github/workflows/coverage.yml runs
# them after a green CI instead, so this workflow's status is the merge gate and coverage is a
# report that follows it.
#
# A push whose every changed file is documentation skips this workflow (paths-ignore below);
# .github/workflows/docs.yml still runs the text checks over those files, without a build.
#
# Every job that builds restores Qt and configures its own tree -- about 40 s of the fixed cost,
# paid four times. That is the price of not shipping a build tree between jobs: a Debug tree with
# the PDBs the coverage tools read is gigabytes, which costs more to upload and download than the
# rebuild does. .github/actions/configure holds the steps that would otherwise be a copy per job,
# and its Qt cache is what keeps the install from being the largest part of that fixed cost.
#
# Not here on purpose: lens_gtest_integration needs a real mouse and the real clipboard, and
# lens_gtest_smoke needs a real model and an API key. Both stay human-run; see TEST.md section 2.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ui-prototypes/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ui-prototypes/**'
      - 'LICENSE'

jobs:
  changes:
    # The one place the path map lives; scripts/quality/ci-changes.sh reads the diff and prints
    # the booleans the jobs below consume. Ubuntu runs only git and makes the decision cheap; the
    # gate waits for it, so this is the only added wall-clock cost of the filter.
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.changes.outputs.unit }}
      app: ${{ steps.changes.outputs.app }}
      qml: ${{ steps.changes.outputs.qml }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify the change set
        id: changes
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/quality/ci-changes.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"

  unit:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: windows-latest

    steps:
      # v5 is the release whose whole content is "run under node 24", which is what the
      # deprecation notice asks for. v6 and v7 exist but change things this job does not use --
      # where the checkout keeps git credentials, and which refs a pull_request_target may check
      # out -- so this is as far as it needs to go; v5 wants runner 2.327.1, which the hosted
      # images are.
      - uses: actions/checkout@v5

      - uses: ./.github/actions/configure

      # The offline suite and the app seams. It links lens_app but not the QML plugin, so no QML
      # module and no QML ahead-of-time compilation figures in this job.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens_gtest_unit

      - name: Unit tests
        run: ./build-ninja/test/googletest/lens_gtest_unit.exe
        env:
          QT_FORCE_STDERR_LOGGING: 1

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/configure

      # The shipped executable first. It links lens_app, so this is also where the QML module and
      # src/app's own sources are compiled; the qml jobs build what their suites need and would
      # not notice a break outside their own link lines.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens

      # docs/adr/0068: the shipped build carries no developer surface, and the packaging scripts never switch
      # LENS_ENABLE_DEV_SURFACE on. Both are checked as text, because a surface left in would not fail the build.
      - name: No developer surface in the shipped build
        shell: pwsh
        run: |
          if (Select-String -LiteralPath build-ninja/src/app/lens.exe -Pattern 'dev surface:', 'dev pipe:' -SimpleMatch -Quiet) {
            throw 'the default build carries the developer surface'
          }
          if (Select-String -Path scripts/release/* -Pattern 'LENS_ENABLE_DEV_SURFACE' -SimpleMatch -Quiet) {
            throw 'a packaging script switches the developer surface on'
          }

      # The developer surface (docs/adr/0068) is compiled out of the shipped build, so nothing above
      # would notice it breaking. Reconfiguring in the same tree changes the lens target's compile
      # definition only, so this rebuild is the lens target's sources and a link, not a second build.
      - name: Build the developer surface
        run: |
          cmake -S . -B build-ninja -DLENS_ENABLE_DEV_SURFACE=ON
          cmake --build --preset ninja-qt6 --target lens

      - name: Developer surface smoke
        run: scripts/qa/dev-smoke.ps1 -Exe build-ninja/src/app/lens.exe

  qml-components:
    needs: changes
    if: needs.changes.outputs.qml == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/configure

      # One of the two QTest targets; both link the module plugin, so this build produces
      # everything the lint below reads and the suite runs.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens_qtest_components

      # After the build, never before it: qmllint resolves the module's own types through the
      # build tree's copies of the .qml files, so a tree that has not been built is judged from
      # files that are not there. scripts/quality/qml-lint.sh owns the reasoning and the ratchet, and
      # expects a configured tree -- which the configure action has just made.
      - name: QML lint
        run: bash scripts/quality/qml-lint.sh
        shell: bash

      # QT_QPA_PLATFORM=offscreen is what makes the suites headless -- they build real windows,
      # and offscreen is the platform that gives them one without a screen. On a runner there is
      # a console, so QT_FORCE_STDERR_LOGGING is belt and braces here rather than the necessity
      # it is on the development machine; it is set so a failure reads the same in both places,
      # which is the command TEST.md section 2 documents.
      - name: Component tests
        run: ./build-ninja/test/qtest/lens_qtest_components.exe
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1

  qml-surfaces:
    needs: changes
    if: needs.changes.outputs.qml == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/configure

      # The other QTest target, and the same module build the component job has just done: the
      # two suites share no runner, which is what puts this one's start beside that job's run
      # instead of behind it.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens_qtest_surfaces

      # The surface suite is the long half of the gate and is sharded by case file: one process
      # per file, two at a time. No file depends on another, and setup.cpp names its settings
      # copy by process id, so the workers share nothing. The script prints one Totals line per
      # file, and the whole log of a file that went red. Three processes over-subscribed the
      # four-vCPU runner (2m54 against the single-process 2m51); two is the count it can carry.
      - name: Surface tests (sharded)
        shell: bash
        run: bash scripts/qa/qtest-parallel.sh --build build-ninja --shards 2

  hygiene:
    runs-on: windows-latest

    steps:
      # The pre-commit hook is the one copy of these rules. CI hands it the files this push or pull
      # request changed, so a red run names the file; the qml-components job runs the QML lint instead.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 19.1.5 is the version the VS copy ships (config/paths.default.json), so CI formats the way a
      # developer's machine does. The hook finds it on PATH.
      #
      # zhlint is not installed here. Typography only ever looks at .md files, and every change
      # that touches one runs .github/workflows/docs.yml, which installs the pinned zhlint and
      # checks exactly those files. Doing it again here cost about 25 s a push and a second
      # reason for the job to go red on a document.
      - name: Install clang-format
        run: pip install clang-format==19.1.5

      # The hook checks only the files a change touches, so a change to .clang-format would leave
      # every other file unchecked. This runs the whole tree on every push, so the config and the
      # code cannot drift apart.
      - name: Format check, whole tree
        shell: bash
        run: git ls-files 'src/*' 'test/*' | grep -E '\.(cpp|h)$' | xargs clang-format --dry-run --Werror

      # A push to main compares against the previous head. A zero "before" (a brand-new branch)
      # makes the diff fail, which leaves the file list empty and checks nothing.
      - name: Text, format and guard checks
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LENS_SKIP_QML: "1"
          LENS_SKIP_TYPOGRAPHY: "1"
        run: |
          LENS_CHECK_FILES="$(git diff --name-only --diff-filter=ACM "$BASE" HEAD)" sh .githooks/pre-commit
