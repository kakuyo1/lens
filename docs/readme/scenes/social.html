<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · social preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:1280px;height:640px;overflow:hidden;background:#15161a;color:#f2f3f6;
  font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(700px 460px at 82% 24%, rgba(77,196,146,.18), transparent 60%),
    radial-gradient(600px 400px at 10% 100%, rgba(83,104,160,.20), transparent 64%),
    #15161a;
}
.wrap{position:absolute;inset:0;padding:58px 64px;display:flex;align-items:center;gap:40px}
.left{width:600px;flex:none}
.brand{display:flex;align-items:center;gap:12px;color:#c9ccd4;font-size:14px}
.brand img{width:42px;height:42px;border-radius:12px}
.brand b{font-size:18px;font-weight:650;color:#fff;letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;margin-top:34px;padding:6px 12px;border:1px solid rgba(77,196,146,.34);border-radius:999px;background:rgba(77,196,146,.10);color:#7ad9ad;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{margin-top:16px;font-size:70px;line-height:1.02;letter-spacing:-.035em;font-weight:650}
h1 span{color:#4dc492}
p{margin-top:20px;color:#aeb2bd;font-size:23px;line-height:1.5;max-width:600px}
.meta{margin-top:30px;display:flex;gap:18px;color:#7d818c;font-size:14px}
.meta b{color:#c9ccd4;font-weight:600}
.card{position:relative;width:512px;height:469px;border-radius:28px;overflow:hidden;flex:none;
  background:#f6f2ea;box-shadow:0 40px 100px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card::after{content:"";position:absolute;inset:0;border-radius:28px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="brand"><img src="../brand/lens-mark.svg" alt=""><b>Lens</b></div>
    <div class="pill">English first</div>
    <h1>Read English<br><span>in English.</span></h1>
    <p>A Windows tray companion that explains the word beside the page — in clearer English, without the tab switch.</p>
    <div class="meta"><span><b>Windows 10/11</b> x64</span><span><b>MIT</b> open source</span><span><b>Bring your own model</b></span></div>
  </div>
  <div class="card"><img src="../brand/bubble-page-social.png" alt=""></div>
</div>
</body>
</html>
