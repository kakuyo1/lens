<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 桌面宠物</title>
<style>
:root{
  --bg:#e9ebef; --panel:#fff; --panel2:#f1f3f7; --line:#d6dae1; --line2:#e6e9ee;
  --text:#1a1a1f; --muted:#66666f; --faint:#9d9da8;
  --ok:#2f9e6e;
  --ink:#1a1a1f; --on:#fff;
  --r-lg:18px; --sw-off:var(--line);
  --sh2:0 2px 6px rgba(20,20,26,.06),0 24px 60px -24px rgba(20,20,26,.24);
  --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
}
html[data-theme=dark]{
  --bg:#131316; --panel:#1c1c20; --panel2:#242429; --line:#2f2f37; --line2:#26262c;
  --text:#e9e9ee; --muted:#a3a3ae; --faint:#75757f;
  --ok:#45c08a;
  --ink:#e9e9ee; --on:#16161a;
  --sh2:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
}
/* Glass themes. The card is .settings; the stage and the other content are not cards and take no glass. */
html[data-theme=frosted],html[data-theme=liquid]{
  --bg:transparent;
  background-image:var(--wall); background-attachment:fixed; background-size:cover;
}
html[data-theme=frosted]{
  --wall:url("frosted-backdrops/night-lines.png");
  --panel:rgba(255,255,255,.40); --panel2:rgba(18,24,36,.065);
  --line:rgba(18,24,36,.15); --line2:rgba(18,24,36,.10);
  --text:#14161c; --muted:#3c4250; --faint:#535865;
  --ink:#191b21; --on:#fff; --sw-off:rgba(18,24,36,.22);
  --sh2:0 4px 14px rgb(255 255 255/5.5%);
}
html[data-theme=liquid]{
  --wall:url("liquid-backdrops/cool-wall.png");
  --panel:rgba(248,250,254,.78); --panel2:rgba(18,24,36,.075);
  --line:rgba(18,24,36,.16); --line2:rgba(18,24,36,.11);
  --text:#101319; --muted:#333846; --faint:#4a4f5e;
  --ink:#12151b; --on:#fff; --sw-off:rgba(18,24,36,.24);
  --sh2:0 1px 2px rgba(10,14,24,.14),0 22px 54px -20px rgba(10,14,24,.48);
  --r-lg:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);color:var(--text);background:var(--bg);min-height:100vh;display:grid;place-items:center;padding:36px 20px;font-size:13px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* 扩展 → 桌面宠物：与设置面板同尺寸、同页头页脚 */
.settings{width:380px;height:480px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh2);display:flex;flex-direction:column;overflow:hidden}
html[data-theme=frosted] .settings{backdrop-filter:blur(var(--glass-blur,6px)) saturate(var(--glass-sat,120%));border-color:rgba(255,255,255,var(--glass-rim,.2))}
html[data-theme=liquid] .settings{background:transparent;border-color:rgba(255,255,255,var(--glass-rim,.1));backdrop-filter:blur(var(--glass-blur,6px)) contrast(1.05);box-shadow:var(--sh2)}
html[data-theme=liquid][data-refract] .settings{backdrop-filter:blur(var(--glass-blur,6px)) url(#lg-liquid)}
.set-h{display:flex;align-items:center;gap:9px;padding:0 20px;min-height:58px;border-bottom:1px solid var(--line2);flex:none}
.set-back{display:grid;place-items:center;width:26px;height:26px;margin-left:-6px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.set-back:hover{background:var(--panel2);color:var(--text)}
.set-title{font-size:14px;font-weight:700}
.set-sep{color:var(--faint);font-size:12px}
.set-crumb{font-size:12px;color:var(--muted);font-weight:400}
.set-h .close{margin-left:auto;width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--faint);font-size:18px;line-height:1}
.set-h .close:hover{background:var(--panel2);color:var(--text)}
.set-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 20px 18px}
.set-f{display:flex;align-items:center;gap:8px;padding:0 20px;min-height:56px;border-top:1px solid var(--line2);flex:none}
.status{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.btn{padding:6px 14px;border-radius:999px;border:1px solid transparent;font-size:12px;font-weight:600}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.ink{background:var(--ink);color:var(--on)}
.btn.ink:disabled{opacity:.45;cursor:default}

/* 开关行，规格同设置 */
.swrow{display:flex;align-items:center;gap:12px;min-height:44px}
.swrow .swlabel{flex:1}
.swrow.off{color:var(--faint)}
.swrow.off .switch{opacity:.45}
.swhelp{font-size:11px;color:var(--muted);margin-top:-2px;margin-bottom:12px}
.switch{flex:none;width:34px;height:20px;border:0;border-radius:99px;background:var(--sw-off);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel)}
.switch[aria-checked=true]{background:var(--ink)}
.switch[aria-checked=true]::after{left:auto;right:2px;background:var(--on)}
html[data-theme=dark] .switch::after{background:var(--faint)}
html[data-theme=dark] .switch[aria-checked=true]::after{background:var(--on)}

/* Level 1: section title, bold with a divider above it. The first section has none, since the toggle block sits right above. */
.group-title{font-size:12px;font-weight:700;color:var(--text);margin:16px 0 9px;padding-top:14px;border-top:1px solid var(--line2)}
#pet-section > .group-title:first-child{margin-top:4px;padding-top:0;border-top:0}

/* 宠物类型：下拉，与设置页的下拉同规格（UI-SPEC.md 控件规格）。 */
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:8px;width:100%;height:35px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-family:var(--f);font-size:13px;text-align:left}
.dd-btn svg{margin-left:auto;width:14px;height:14px;color:var(--faint);flex:none}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:9;display:none;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh2);padding:5px;max-height:252px;overflow-y:auto}
.dd.open .dd-list{display:block}
/* Popover on frosted: 78% white (DESIGN.md 3.1c), not the card's 40%. Liquid already uses --panel, which is 78%. */
html[data-theme=frosted] .dd-list{background:rgba(255,255,255,.78)}
.dd-item{display:flex;align-items:center;width:100%;height:29px;padding:0 11px;border:0;border-radius:8px;background:transparent;font-size:13px;color:var(--text);text-align:left}
.dd-item:hover{background:var(--panel2)}
.dd-item[aria-selected=true]{background:var(--ink);color:var(--on);font-weight:600}

/* 预览舞台：一条桌面边线，宠物站在线上；占位美术，不是最终形态。
   The canvas is the prototype's own, drawn at 2 device pixels a unit: 88 units at 176 px, so the edges stay whole pixels. */
.stage{position:relative;height:192px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);overflow:hidden}
.stage::after{content:"";position:absolute;left:14px;right:14px;bottom:24px;height:1px;background:var(--line)}
.stage.dim{opacity:.5}
.stage canvas{position:absolute;left:50%;bottom:16px;width:176px;height:176px;margin-left:-88px;overflow:visible}
/* Review sign (UI-SPEC.md 4.13, ADR 0088): a wooden plank on a short post standing beside the pet on its foot line. The sign is
   drawn at its design size and scaled by the pet's size, so it stays in proportion to the figure. Same object as the app's
   ReviewSignBoard.qml. */
@font-face{font-family:"Pixelify Sans";src:url("../data/fonts/PixelifySans-Regular.ttf") format("truetype");font-display:block}
.hold-fig{position:absolute;display:none;pointer-events:none;z-index:2}
.hold-fig.on{display:block}
.sign-p{position:absolute;transform-origin:0 0;width:max-content;z-index:2}
.sign-b{position:relative;box-sizing:border-box;background:#d2a76a;color:#2b1a0e;border:3px solid #3a2412;padding:7px 14px;white-space:nowrap;font-family:"Pixelify Sans",monospace;font-size:20px;line-height:20px;box-shadow:inset 1px 1px 0 #e6c88f,inset -1px -1px 0 #a8783f,4px 4px 0 rgba(20,20,26,.11)}
.sign-b .word{position:relative;z-index:1}
.sign-b .grain{position:absolute;left:8px;right:8px;height:1px;background:#bd8d4f}
.sign-b .g1{top:8px}
.sign-b .g2{bottom:8px}
.sign-b .nail{position:absolute;width:2px;height:2px;background:#5b3b20;box-shadow:inset 1px 1px 0 #e6c88f}
.sign-b .n1{left:7px;top:7px}
.sign-b .n2{right:7px;top:7px}
.sign-b .n3{left:7px;bottom:7px}
.sign-b .n4{right:7px;bottom:7px}
.post-b{position:relative;width:10px;height:32px;margin:-2px auto 0;background:#b8864f;border:2px solid #3a2412;box-shadow:inset 2px 0 0 #d2a76a,inset -2px 0 0 #8a5a2f,4px 4px 0 rgba(20,20,26,.11)}
.ground-b{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:20px;height:3px;border-radius:1.5px;background:rgba(33,20,20,.10)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--text)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--on);border-color:var(--ink);font-weight:600}
/* Level 2: slot label in its own left column, faint, so it reads as a row header rather than a chip. Level 3: the chips. */
.slot{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slot:last-child{margin-bottom:0}
/* Min width sized for the longest label ("Cuerpo"), so every row's chips start at the same x. */
.slot-h{flex:none;width:52px;font-size:11px;color:var(--faint)}
.slot .chips{flex:1;min-width:0}
/* 说明占一行，按钮自己占一行左对齐：按钮标签较长，与说明并排会把说明挤成窄栏。
   左移一个内边距让按钮文字与正文左缘对齐；加一圈描边，否则它与分组标题长得一样，看不出能点。 */
.pkg-open{margin-left:-14px;border-color:var(--line)}
.refused{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.refused-row{display:flex;gap:7px;font-size:11px;color:var(--muted)}
/* 包 id 是包提供的字符串，用等宽字与弱色标出，与原因分开 */
.refused-row .id{color:var(--faint);font-family:ui-monospace,Consolas,monospace}
/* 下拉里的来源标记：由应用自己画，包无法影响它的有无与外观。 */
.dd-item .badge{margin-left:auto;flex:none;padding:1px 6px;border-radius:999px;border:1px solid var(--line);font-size:10px;color:var(--muted)}
.dd-item[aria-selected=true] .badge{border-color:transparent;color:var(--on);opacity:.75}
/* 确认弹窗：形态同通知卡片（UI-SPEC.md 4.12），带按钮并吃焦点。点背景不关：它是一次知情同意，不是随手可过的提示。 */
.scrim{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(12,12,16,.42)}
.dlg{width:320px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);padding:18px 18px 14px}
html[data-theme=frosted] .dlg{background:rgba(255,255,255,.78)}
.dlg h2{font-size:14px;font-weight:700;margin-bottom:8px}
.dlg p{font-size:13px;color:var(--muted);line-height:1.55}
.dlg .pkg-name{color:var(--text);font-weight:600}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.themebtn{position:fixed;top:14px;right:16px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--f);font-size:11.5px;cursor:pointer}
.themebtn:hover{color:var(--text)}
@media (prefers-reduced-transparency:reduce){
  html[data-theme=frosted],html[data-theme=liquid]{--panel:#fafbfd;--panel2:#f0f3f8;--line:#dde2ea;--line2:#e9edf3;--sw-off:#d6dae1}
  html[data-theme=frosted] .settings,html[data-theme=liquid] .settings,html[data-theme=liquid][data-refract] .settings{backdrop-filter:none;background-image:none;border-color:var(--line)}
  html[data-theme=liquid] .settings{background:var(--panel)}
  html[data-theme=frosted] .dd-list{background:var(--panel)}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="lg-liquid" filterUnits="userSpaceOnUse" x="0" y="0" width="380" height="480" color-interpolation-filters="sRGB">
    <feImage id="lg-map" x="0" y="0" width="380" height="480" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<div class="settings" id="app">
  <div class="set-h">
    <button class="set-back" type="button" aria-label="返回">‹</button>
    <span class="set-title" id="title"></span>
    <span class="set-sep" aria-hidden="true">/</span>
    <span class="set-crumb" id="crumb"></span>
    <button class="close" type="button" aria-label="关闭">×</button>
  </div>
  <div class="set-body">
    <div class="swrow"><span class="swlabel" id="tog-label"></span><button type="button" class="switch" role="switch" id="tog" aria-checked="false"></button></div>
    <div class="swhelp" id="tog-help"></div>
    <div class="swrow" id="pass-row"><span class="swlabel" id="pass-label"></span><button type="button" class="switch" role="switch" id="pass" aria-checked="false"></button></div>
    <div class="swhelp" id="pass-help"></div>

    <!-- Everything below exists only while the pet is on: type picker, stage, actions, accessories. -->
    <div id="pet-section" hidden>
      <div class="group-title" id="pick-title"></div>
      <div class="dd" id="pet-dd"></div>

      <!-- 宠物包紧挨下发：下拉里列的就是它们，被拒的包是错误信息，藏到页尾会被漏看。 -->
      <div class="group-title" id="pkg-title"></div>
      <div class="swhelp" id="pkg-help"></div>
      <button class="btn ghost pkg-open" id="pkg-open" type="button"></button>
      <div class="refused" id="pkg-refused"></div>

      <div class="group-title" id="stage-title"></div>
      <div class="stage" id="stage">
    <div class="hold-fig" id="holdFig">
      <div class="sign-p" id="signP">
        <div class="sign-b" id="signB">
          <span class="grain g1"></span><span class="grain g2"></span>
          <span class="nail n1"></span><span class="nail n2"></span><span class="nail n3"></span><span class="nail n4"></span>
          <span class="word">spring</span>
        </div>
        <div class="post-b" aria-hidden="true"></div>
        <div class="ground-b" aria-hidden="true"></div>
      </div>
    </div>
  </div>

      <div class="group-title" id="act-title"></div>
      <div class="chips" id="acts"></div>
      <div class="group-title" id="acc-title"></div>
      <div id="slots"></div>
    </div>
  </div>
  <div class="set-f">
    <button class="btn ghost" id="defaults" type="button"></button>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button class="btn ink" id="save" type="button" disabled></button>
  </div>
</div>
<div class="scrim" id="dlg-scrim" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-body">
    <h2 id="dlg-title"></h2>
    <p id="dlg-body"></p>
    <div class="dlg-btns">
      <button class="btn ghost" id="dlg-cancel" type="button"></button>
      <button class="btn ink" id="dlg-ok" type="button"></button>
    </div>
  </div>
</div>
<button class="themebtn" id="tb"></button>

	*          bounds?: HTMLElement}} deps `bounds` keeps the carried sprite inside that element; default is the window.

				y: event.clientY,
				lastX: event.clientX,

/// The page keeps only what the reader sets: on or off, passthrough, the pet, and the worn accessories by slot.
/// Every pet is mounted once from PetPreview; only the chosen one is shown and run. `?on` opens the pet switched on.
const DEFAULT = { on: false, passthrough: false, pet: 'dog', worn: {} };
let state = { ...structuredClone(DEFAULT), on: new URLSearchParams(location.search).has('on') };

const PETS = Object.keys(PET_MANIFEST);
/// 模拟的宠物包，以及被拒的包。原型里没有文件系统也没有校验，这几条写死在这里，只用来对视来源标记、
/// 被拒列表与确认弹窗；真机上它们来自扫描 %APPDATA%\Lens\pets\（见 docs/pet-package-format.md）。
/// `alias` 让预览复用一只已随包宠物的美术，原型因此不必新增美术；真实的包自带 sprites/。
const PACKAGES = [{ id: 'snowfox', name: '雪狐', alias: 'cat' }];

const REFUSED_SHOWN = 3;

/// 外部包的名字原样显示、不进翻译；随包的名字按界面语言取，没有对照时显示 id，与应用一致。
const petLabel = id => pkgOf(id)?.name ?? t.pets[id] ?? id;
/// 预览用的资源与数据：外部包按 alias 取已随包宠物的那一份。
const assetsOf = id => { const src = pkgOf(id)?.alias ?? id; return path => PET_ASSETS[`${src}/${path}`]; };

function renderToggle() {
  $('tog').setAttribute('aria-checked', String(state.on));

  $('pass').setAttribute('aria-checked', String(state.passthrough));

  $('pass-row').classList.toggle('off', !state.on);
}

/** The pet dropdown: the field shows the chosen pet, and the list marks it. */
function renderPicker() {
  const dd = $('pet-dd');
  dd.querySelector('.dd-btn span').textContent = petLabel(state.pet);
  for (const item of dd.querySelectorAll('.dd-item')) item.setAttribute('aria-selected', String(item.dataset.pet === state.pet));
}

/** Opens or closes the pet dropdown, as the settings page's dropdowns do. */
function togglePicker(open) {
  const dd = $('pet-dd');
  dd.classList.toggle('open', open);
  dd.querySelector('.dd-btn').setAttribute('aria-expanded', String(open));

function renderPanel() {
  const s = current();
  shownAction = s ? s.engine.action : null;
  const pet = manifestOf(state.pet);
  $('acts').innerHTML = PetPreview.actionOrder(pet).map(a =>
    `<button type="button" class="chip" data-act="${a}" aria-pressed="${shownAction === a}">${t.acts[a] ?? a}</button>`).join('');
  $('slots').innerHTML = SLOTS.map(slot => `
    <div class="slot"><span class="slot-h">${t.slots[slot]}</span><div class="chips">${

        `<button type="button" class="chip" data-acc="${a.id}" aria-pressed="${state.worn[slot] === a.id}">${t.accs[a.id] ?? a.id}</button>`).join('')

}

/** Shows the chosen pet's stage and runs it only while the pet is on; the others stay hidden and stopped. */
function renderStage() {
  for (const id of ALL_PETS) {
    const s = stages[id];
    if (!s) continue;
    s.canvas.hidden = id !== state.pet;
    s.setRunning(id === state.pet && state.on);
  }
  $('stage').classList.toggle('dim', !state.on);
}

function renderAll() {
  renderToggle();
  $('pet-section').hidden = !state.on;
  renderStage();
  renderPicker();
  renderPanel();
  $('save').disabled = JSON.stringify(state) === JSON.stringify(saved);
}

function renderStatic() {
  $('title').textContent = t.title;

  $('pick-title').textContent = t.pick;
  renderPickerList();
  $('pkg-title').textContent = t.pkg;
  $('pkg-help').textContent = t.pkgHelp;
  $('pkg-open').textContent = t.pkgOpen;
  renderRefused();
  $('stage-title').textContent = t.stage;
  $('act-title').textContent = t.act;
  $('acc-title').textContent = t.acc;
  $('defaults').textContent = t.defaults;
  $('save').textContent = t.save;
  $('dlg-title').textContent = t.dlgTitle;
  $('dlg-cancel').textContent = t.dlgCancel;
  $('dlg-ok').textContent = t.dlgEnable;

/**
 * The dropdown: every bundled pet, then every installed package. The field's own markup is the app's, so it is
 * written as a string; a row's name comes from the list and is set as text, never as markup, because a package
 * supplies its own name (docs/pet-package-format.md §7).
 */
function renderPickerList() {
  $('pet-dd').innerHTML = '<button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"><span></span>'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>';
  const list = document.createElement('div');
  list.className = 'dd-list';
  list.setAttribute('role', 'listbox');
  for (const id of ALL_PETS) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'dd-item';
    item.setAttribute('role', 'option');
    item.dataset.pet = id;
    const name = document.createElement('span');
    name.textContent = petLabel(id);
    item.append(name);
    if (pkgOf(id)) {
      // 来源标记由应用画，包无法影响它的有无与外观。
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = t.ext;
      item.append(badge);
    }
    list.append(item);
  }
  $('pet-dd').append(list);
}

/// 被拒的包：id 与原因都按文本插入，不用 innerHTML，包提供的字符串因此不进标记。
function renderRefused() {
  const box = $('pkg-refused');
  box.textContent = '';
  const addRow = (id, text) => {
    const row = document.createElement('div');
    row.className = 'refused-row';
    if (id !== null) {
      const tag = document.createElement('span');
      tag.className = 'id';
      tag.textContent = id;
      row.append(tag);
    }
    const why = document.createElement('span');
    why.textContent = text;
    row.append(why);
    box.append(row);
  };
  for (const r of REFUSED.slice(0, REFUSED_SHOWN)) addRow(r.id, t.reasons[r.reason] ?? r.reason);
  if (REFUSED.length > REFUSED_SHOWN) addRow(null, t.pkgMore(REFUSED.length - REFUSED_SHOWN));
}

/** Switching pet returns the new pet's preview to idle and drops the worn accessories its catalogue does not have. */
function selectPet(id) {
  const next = stages[id];
  const manifest = manifestOf(id);
  if (id === state.pet || !next || !manifest) return;
  const kept = PetPreview.keepWorn(new Map(Object.entries(state.worn)), manifest.accessories);
  state.pet = id;
  state.worn = Object.fromEntries(kept);
  next.accessories.worn = kept;
  next.engine.stop();
}

/// 已经确认过的包，按 id 记。真机上这条落在设置文档的 PET.confirmed（docs/adr/0043）；原型不持久化。
const confirmed = new Set();
/// 正在等确认的那只包，没有等待时为 null。
let pendingPkg = null;

/// 正文按占位符切成文本节点，包名单独放进一个 span：包提供的字符串永远只当文本，不进标记。
function fillMessage(el, template, name) {
  const [before, after] = template.split('{}');
  const strong = document.createElement('span');
  strong.className = 'pkg-name';
  strong.textContent = name;
  el.textContent = '';
  el.append(before, strong, after ?? '');
}

/** First pick of an external package asks once before it takes effect; a bundled pet switches at once. */
function pickPet(id) {
  togglePicker(false);
  if (pkgOf(id) && !confirmed.has(id)) {
    openConfirm(id);
    return;
  }
  selectPet(id);
  $('pet-dd').querySelector('.dd-btn').focus();
}

function openConfirm(id) {
  pendingPkg = id;
  fillMessage($('dlg-body'), t.dlgBody, petLabel(id));
  $('dlg-scrim').hidden = false;
  // 默认动作是取消：按 Esc 与点背景都不启用，只有明确按下 “启用” 才生效。
  $('dlg-cancel').focus();
}

function closeConfirm() {
  pendingPkg = null;
  $('dlg-scrim').hidden = true;
  $('pet-dd').querySelector('.dd-btn').focus();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.dd')) togglePicker(false);
  const b = e.target.closest('button');
  if (!b) return;
  if (b.classList.contains('dd-btn')) { togglePicker(!$('pet-dd').classList.contains('open')); return; }
  if (b.id === 'tog') {
    state.on = !state.on;
    if (!state.on) current()?.engine.stop();
  }
  else if (b.id === 'pass') { state.passthrough = !state.passthrough; }
  else if (b.dataset.pet) { pickPet(b.dataset.pet); }
  else if (b.dataset.act) { current()?.engine.play(b.dataset.act); renderPanel(); return; }
  else if (b.dataset.acc) {
    const s = current();
    if (!s) return;
    s.accessories.toggle(b.dataset.acc);
    state.worn = Object.fromEntries(s.accessories.worn);
  }
  else if (b.id === 'defaults') {
    state = structuredClone(DEFAULT); saved = structuredClone(DEFAULT);
    for (const s of Object.values(stages)) { s.engine.stop(); s.accessories.worn.clear(); }
    $('status').textContent = t.reset; renderAll(); return;
  }
  else if (b.id === 'save') {
    saved = structuredClone(state); $('status').textContent = t.saved; renderAll(); return;
  }
  // 原型里打不开文件管理器。真机上这一颗用系统文件管理器打开 %APPDATA%\Lens\pets\，目录不存在时先创建。
  else if (b.id === 'pkg-open') { return; }
  else if (b.id === 'dlg-cancel') { closeConfirm(); return; }
  else if (b.id === 'dlg-ok') {
    const id = pendingPkg;
    if (!id) return;
    confirmed.add(id);
    closeConfirm();
    selectPet(id);
  }
  else return;
  $('status').textContent = '';
  renderAll();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  // 弹窗先收：它在等待一次明确的回答，Esc 等同于取消。
  if (!$('dlg-scrim').hidden) { closeConfirm(); return; }
  if (!$('pet-dd').classList.contains('open')) return;
  togglePicker(false);
  $('pet-dd').querySelector('.dd-btn').focus();
});

// The chip that matches the action now playing follows it, including the return to idle after a one-shot.
// Rebuilds only when the action changes, so a click in flight is not swapped out under the pointer.
setInterval(() => {
  const s = current();
  if (!s || !state.on || s.engine.action === shownAction) return;
  renderPanel();
}, 250);

renderStatic();
renderAll();
// ?dlg=1 直接打开确认弹窗，供对视与截图；与 ?on 一样只是原型的开发开关。
if (new URLSearchParams(location.search).has('dlg')) openConfirm(PACKAGES[0].id);
/// The review sign on the stage while ask plays (UI-SPEC.md 4.13, ADR 0088). The plank stands on the pet's idle foot line beside
/// it: the left when there is room, the right otherwise. The idle ink is measured once from each pet's own sheet, frame 0.
const idleInk = new Map();
function measureInk(src) {
  return new Promise(done => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = 88;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 88, 88, 0, 0, 88, 88);
      const px = ctx.getImageData(0, 0, 88, 88).data;
      let left = 88, right = 0, bottom = 0;
      for (let y = 0; y < 88; y++) for (let x = 0; x < 88; x++) {
        if (px[(y * 88 + x) * 4 + 3] === 0) continue;
        if (x < left) left = x;
        if (x + 1 > right) right = x + 1;
        if (y + 1 > bottom) bottom = y + 1;
      }
      done({ left, right, bottom });
    };
    img.src = src;
  });
}
const holdFig = $('holdFig'), signP = $('signP'), signB = $('signB');
function drawHold() {
  const s = stages[state.pet];
  const on = Boolean(s && state.on && s.engine.action === 'ask' && idleInk.has(state.pet));
  holdFig.classList.toggle('on', on);
  if (!on) return;
  const ink = idleInk.get(state.pet);
  const cv = s.canvas;
  const stageW = cv.parentElement.clientWidth;
  const U = cv.offsetWidth / 88;
  const K = U / 3.01;
  const bw = signB.offsetWidth * K;
  const base = cv.offsetTop + ink.bottom * U;
  const left = cv.offsetLeft + ink.left * U - 8 - bw;
  const right = cv.offsetLeft + ink.right * U + 8;
  const side = left >= 4 && left + bw <= stageW - 4 ? 'left' : 'right';
  const x = side === 'left' ? left : Math.min(right, stageW - 4 - bw);
  holdFig.style.left = cv.offsetLeft + 'px';
  holdFig.style.top = cv.offsetTop + 'px';
  holdFig.style.width = holdFig.style.height = 88 * U + 'px';
  signP.style.left = (x - cv.offsetLeft) + 'px';
  signP.style.top = (base - cv.offsetTop - (40 + 32 - 2) * K) + 'px';
  signP.style.transform = `scale(${K})`;
}
(function loopHold() { drawHold(); requestAnimationFrame(loopHold); })();
(async () => {
  const stage = $('stage');
  await Promise.all(ALL_PETS.map(async id => {
    const pet = manifestOf(id);
    const resolve = assetsOf(id);
    const canvas = document.createElement('canvas');
    canvas.hidden = true;
    stage.append(canvas);
    stages[id] = { canvas, ...(await PetPreview.mountStage(canvas, pet, { scale: 2, resolve, bounds: stage })) };
    idleInk.set(id, await measureInk(resolve(pet.actions.idle.sheet)));
  }));
  // ?act=ask (and the other chip names) starts the chosen pet on that action, for screenshots of the page.
  const want = new URLSearchParams(location.search).get('act');
  if (want && stages[state.pet]) stages[state.pet].engine.play(want);
  renderAll();
  // ?preview scrolls the panel to the stage, for screenshots of the preview; like ?dlg, a prototype switch only.
  if (new URLSearchParams(location.search).has('preview')) $('stage').scrollIntoView({ block: 'center' });
})();

/// 折射能力探测：不支持 url() 形式 backdrop-filter 的浏览器会丢掉这条声明，读回空串。此时液体玻璃退回 CSS 的模糊与高光。
const refractOK = (() => { const p = document.createElement("div"); p.style.backdropFilter = "url(#lg-liquid)"; return p.style.backdropFilter !== ""; })();
const svgAttr = (id, name, v) => document.getElementById(id).setAttribute(name, v);
/// 按卡片尺寸画一次位移图（R/G 编码到 [0,255]，128 为零位移）。位移取模糊后的圆角矩形遮罩的梯度：
/// 遮罩在边缘最陡、向中心趋于平坦，梯度处处连续，所以没有距离场那样沿对角线（两条边的等距线）翻转的接缝，不会画出 X 形。
/// 位移朝内取样：边缘的像素从玻璃里面借内容，边缘因此被压弯；位移的强度由 feDisplacementMap 的 scale 决定，不在这里烤死。
function liquidMap(W = 380, H = 480, R = 22, S = 18) {
  const mask = document.createElement("canvas");
  mask.width = W; mask.height = H;
  const mctx = mask.getContext("2d");
  mctx.filter = `blur(${S}px)`;
  mctx.fillStyle = "#fff";
  mctx.beginPath(); mctx.roundRect(0, 0, W, H, R); mctx.fill();
  const m = mctx.getImageData(0, 0, W, H).data;
  // 读 alpha：白色填充的 RGB 恒为 255，模糊后的梯度只在 alpha 里
  const at = (x, y) => m[(Math.min(Math.max(y, 0), H - 1) * W + Math.min(Math.max(x, 0), W - 1)) * 4 + 3] / 255;
  // 遮罩向内升高，中心差分即朝内的梯度；按全图最大值归一，最强处正好编码到 127
  const gx = new Float32Array(W * H), gy = new Float32Array(W * H);
  let max = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    gx[i] = (at(x + 1, y) - at(x - 1, y)) / 2;
    gy[i] = (at(x, y + 1) - at(x, y - 1)) / 2;
    max = Math.max(max, Math.hypot(gx[i], gy[i]));
  }
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d"), img = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) img.data.set([128 + 127 * gx[i] / max, 128 + 127 * gy[i] / max, 128, 255], i * 4);
  ctx.putImageData(img, 0, 0);
  return canvas.toDataURL();
}
if (refractOK) svgAttr("lg-map", "href", liquidMap(380, 480, 22, 18));

// Theme toggle: the same dev affordance as the other surfaces, hidden with ?shot.
const tb = $('tb');
function applyTheme(v) {
  document.documentElement.dataset.theme = v;
  if (v === 'liquid' && refractOK) document.documentElement.dataset.refract = 'on';
  else delete document.documentElement.dataset.refract;
  tb.textContent = { light: t.themeLight, dark: t.themeDark, frosted: t.themeFrosted, liquid: t.themeLiquid }[v];
}
// ?theme= takes the glass themes too; ?bg= picks one test backdrop from the current glass theme's set. No picker on this surface.
const BACKDROPS = {
  frosted: ['night-lines', 'text-dense', 'color-blocks', 'sky-light', 'checker'],
  liquid: ['cool-wall', 'web-light', 'web-dark', 'colorful', 'stripes', 'black', 'white'],
};
const query = new URLSearchParams(location.search);
const theme = ['dark', 'frosted', 'liquid'].includes(query.get('theme')) ? query.get('theme') : 'light';
applyTheme(theme);
if (BACKDROPS[theme]?.includes(query.get('bg'))) document.documentElement.style.setProperty('--wall', `url("${theme}-backdrops/${query.get('bg')}.png")`);
const THEMES = ['light', 'dark', 'frosted', 'liquid'];
tb.onclick = () => applyTheme(THEMES[(THEMES.indexOf(document.documentElement.dataset.theme) + 1) % THEMES.length]);
if (query.has('shot')) tb.remove();
</script>
</body>
