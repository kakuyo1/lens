<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 托盘菜单</title>
<style>
:root{
  --bg:#e9ebef; --panel:#fff; --panel2:#f1f3f7; --line:#d6dae1; --line2:#e6e9ee;
  --text:#1a1a1f; --muted:#66666f; --faint:#9d9da8; --ok:#2f9e6e; --ok-bg:#e6f4ee;
  --ink:#1a1a1f; --on:#fff; --danger:#b3564a;
  --sh2:0 2px 6px rgba(20,20,26,.06),0 24px 60px -24px rgba(20,20,26,.24);
  --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
}
html[data-theme=dark]{
  --bg:#131316; --panel:#1c1c20; --panel2:#242429; --line:#2f2f37; --line2:#26262c;
  --text:#e9e9ee; --muted:#a3a3ae; --faint:#75757f;
  --ok:#45c08a; --ok-bg:#1a3527;
  --ink:#e9e9ee; --on:#16161a; --danger:#d98d81;
  --sh2:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
}
/* 玻璃主题（UI.md 3.1c 雾面、3.1d 流光）：令牌与规则照抄 settings.html，数值不改。 */
html[data-theme=frosted],html[data-theme=liquid]{
  --bg:transparent;
  background-image:var(--wall); background-attachment:fixed; background-size:cover;
}
html[data-theme=frosted]{
  --wall:url("frosted-backdrops/night-lines.png");
  --panel:rgba(255,255,255,.40); --panel2:rgba(18,24,36,.065);
  --line:rgba(18,24,36,.15); --line2:rgba(18,24,36,.10);
  --text:#14161c; --muted:#3c4250; --faint:#535865;
  --ink:#191b21; --on:#fff; --sw-off:rgba(18,24,36,.22);
  --sh2:0 4px 14px rgb(255 255 255/5.5%);
}
html[data-theme=liquid]{
  --wall:url("liquid-backdrops/cool-wall.png");
  --panel:rgba(248,250,254,.78); --panel2:rgba(18,24,36,.075);
  --line:rgba(18,24,36,.16); --line2:rgba(18,24,36,.11);
  --text:#101319; --muted:#333846; --faint:#4a4f5e;
  --ink:#12151b; --on:#fff; --sw-off:rgba(18,24,36,.24);
  --sh2:0 1px 2px rgba(10,14,24,.14),0 22px 54px -20px rgba(10,14,24,.48);
}
html[data-theme=frosted] .traymenu{backdrop-filter:blur(var(--glass-blur,6px)) saturate(var(--glass-sat,120%));border-color:rgba(255,255,255,var(--glass-rim,.2))}
html[data-theme=frosted] .submenu{background:rgba(255,255,255,.78)}
html[data-theme=liquid] .traymenu{background:transparent;border-color:rgba(255,255,255,var(--glass-rim,.1));backdrop-filter:blur(var(--glass-blur,6px)) contrast(1.05);box-shadow:var(--sh2)}
html[data-theme=liquid][data-refract] .traymenu{backdrop-filter:blur(var(--glass-blur,6px)) url(#lg-liquid)}
@media (prefers-reduced-transparency:reduce){
  html[data-theme=frosted],html[data-theme=liquid]{--panel:#fafbfd;--panel2:#f0f3f8;--line:#dde2ea;--line2:#e9edf3;--sw-off:#d6dae1}
  html[data-theme=frosted] .traymenu,html[data-theme=liquid] .traymenu,html[data-theme=liquid][data-refract] .traymenu{backdrop-filter:none;background-image:none;border-color:var(--line)}
  html[data-theme=liquid] .traymenu{background:var(--panel)}
  html[data-theme=frosted] .submenu{background:var(--panel)}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);color:var(--text);background:var(--bg);min-height:100vh;display:grid;place-items:center}

.traymenu{width:240px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh2);padding:6px}
.tm-info{display:flex;align-items:center;gap:8px;padding:8px 11px 9px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line2);margin-bottom:4px}
.tm-info b{color:var(--text);font-weight:650}
 .tm-info .mark{width:15px;height:15px;flex:none;background:var(--ok);-webkit-mask:url("../icons/lens.svg") center/contain no-repeat;mask:url("../icons/lens.svg") center/contain no-repeat}
 html[data-theme=dark] .tm-info .mark{background:var(--ok)}
.tm-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;font-size:12.5px;color:var(--text);cursor:default}
.tm-item svg{width:15px;height:15px;color:var(--muted);flex:none}
.tm-item .tm-sub{margin-left:auto;font-size:11px;color:var(--faint);font-family:var(--mono)}
.tm-item:hover{background:var(--panel2)}
.tm-item.has-sub{position:relative}
.submenu{position:absolute;right:calc(100% + 8px);top:-6px;min-width:104px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh2);padding:5px}
.sm-item{padding:7px 11px;border-radius:8px;font-size:12.5px;color:var(--text);cursor:default;white-space:nowrap}
.sm-item:hover{background:var(--panel2)}
.sm-item.on{background:var(--ink);color:var(--on);font-weight:600}
.themebtn{position:fixed;top:14px;right:16px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--f);font-size:11.5px;cursor:pointer}
.themebtn:hover{color:var(--text)}
.tm-sep{height:1px;background:var(--line2);margin:5px 8px}
.tm-item.danger{color:var(--danger)}
.tm-item.danger svg{color:var(--danger)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="lg-liquid" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="191" color-interpolation-filters="sRGB">
    <feImage id="lg-map" x="0" y="0" width="240" height="191" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<div class="traymenu">
  <div class="tm-info"><span class="mark" aria-hidden="true"></span><b>手动模式</b></div>
  <div class="tm-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 19V9M12 19V5M19 19v-6"/></svg>今日统计<span class="tm-sub">128 词 · ¥0.42</span></div>
  <div class="tm-item has-sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M4 12h16"/><path d="M12 4c2.6 2.8 2.6 13.2 0 16M12 4c-2.6 2.8-2.6 13.2 0 16"/></svg>语言<span class="tm-sub">中文</span>
    <div class="submenu">
      <div class="sm-item on">中文</div>
      <div class="sm-item">English</div>
    </div>
  </div>
  <div class="tm-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="11" cy="7" r="1.8" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="8.5" cy="17" r="1.8" fill="currentColor" stroke="none"/></svg>设置</div>
  <div class="tm-sep"></div>
  <div class="tm-item danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v8"/><path d="M6.3 5.8a8 8 0 1 0 11.4 0"/></svg>退出</div>
</div>
<button class="themebtn" id="tb">静谧暗夜</button>
<script>
const tb = document.getElementById('tb');
/// 折射能力探测：不支持 url() 形式 backdrop-filter 的浏览器会丢掉这条声明，读回空串。此时液体玻璃退回 CSS 的模糊与高光。
const refractOK = (() => { const p = document.createElement("div"); p.style.backdropFilter = "url(#lg-liquid)"; return p.style.backdropFilter !== ""; })();
const svgAttr = (id, name, v) => document.getElementById(id).setAttribute(name, v);
/// 按卡片尺寸画一次位移图（R/G 编码到 [0,255]，128 为零位移）。位移取模糊后的圆角矩形遮罩的梯度：
/// 遮罩在边缘最陡、向中心趋于平坦，梯度处处连续，所以没有距离场那样沿对角线（两条边的等距线）翻转的接缝，不会画出 X 形。
/// 位移朝内取样：边缘的像素从玻璃里面借内容，边缘因此被压弯；位移的强度由 feDisplacementMap 的 scale 决定，不在这里烤死。
function liquidMap(W = 380, H = 480, R = 22, S = 18) {
  const mask = document.createElement("canvas");
  mask.width = W; mask.height = H;
  const mctx = mask.getContext("2d");
  mctx.filter = `blur(${S}px)`;
  mctx.fillStyle = "#fff";
  mctx.beginPath(); mctx.roundRect(0, 0, W, H, R); mctx.fill();
  const m = mctx.getImageData(0, 0, W, H).data;
  // 读 alpha：白色填充的 RGB 恒为 255，模糊后的梯度只在 alpha 里
  const at = (x, y) => m[(Math.min(Math.max(y, 0), H - 1) * W + Math.min(Math.max(x, 0), W - 1)) * 4 + 3] / 255;
  // 遮罩向内升高，中心差分即朝内的梯度；按全图最大值归一，最强处正好编码到 127
  const gx = new Float32Array(W * H), gy = new Float32Array(W * H);
  let max = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    gx[i] = (at(x + 1, y) - at(x - 1, y)) / 2;
    gy[i] = (at(x, y + 1) - at(x, y - 1)) / 2;
    max = Math.max(max, Math.hypot(gx[i], gy[i]));
  }
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d"), img = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) img.data.set([128 + 127 * gx[i] / max, 128 + 127 * gy[i] / max, 128, 255], i * 4);
  ctx.putImageData(img, 0, 0);
  return canvas.toDataURL();
}
if (refractOK) svgAttr("lg-map", "href", liquidMap(240, 191, 13, 9));
const BACKDROPS = { frosted: ['night-lines', 'text-dense', 'color-blocks', 'sky-light', 'checker'], liquid: ['cool-wall', 'web-light', 'web-dark', 'colorful', 'stripes', 'black', 'white'] };
const THEMES = ['light', 'dark', 'frosted', 'liquid'];
const THEME_NAME = { light: '晴朗白昼', dark: '静谧暗夜', frosted: '雾面玻璃', liquid: '流光玻璃' };
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  tb.textContent = THEME_NAME[t];
  if (refractOK && t === 'liquid') document.documentElement.dataset.refract = 'on';
  else delete document.documentElement.dataset.refract;
}
const q = new URLSearchParams(location.search);
const theme = ['dark', 'frosted', 'liquid'].includes(q.get('theme')) ? q.get('theme') : 'light';
applyTheme(theme);
if ((BACKDROPS[theme] || []).includes(q.get('bg'))) document.documentElement.style.setProperty('--wall', `url("${theme}-backdrops/${q.get('bg')}.png")`);
tb.onclick = () => applyTheme(THEMES[(THEMES.indexOf(document.documentElement.dataset.theme) + 1) % THEMES.length]);
</script>
</body>
</html>
