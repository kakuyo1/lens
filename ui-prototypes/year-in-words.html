<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 单词年度记录</title>
<style>
:root{
  --bg:#e9ebef; --panel:#fff; --panel2:#f1f3f7; --line:#d6dae1; --line2:#e6e9ee;
  --text:#1a1a1f; --muted:#66666f; --faint:#8a8a95; --ok:#2f9e6e;
  --ink:#1a1a1f; --on:#fff; --r-lg:18px; --hue:145; --palette-hue:145;
  --cell0:#ebedf0;
  --cell1:hsl(var(--hue) 58% 84%); --cell2:hsl(var(--hue) 60% 64%);
  --cell3:hsl(var(--hue) 64% 46%); --cell4:hsl(var(--hue) 68% 30%);
  --sh2:0 2px 6px rgba(20,20,26,.06),0 24px 60px -24px rgba(20,20,26,.24);
  --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
}
html[data-theme=dark]{
  --bg:#0b0e13; --panel:#171c25; --panel2:#212936; --line:#36404e; --line2:#242b37;
  --text:#e9edf3; --muted:#a8b3c2; --faint:#8a95a6; --ok:#4dc492;
  --ink:#eef3fa; --on:#0c1016; --cell0:#252b33;
  --cell1:hsl(var(--hue) 58% 29%); --cell2:hsl(var(--hue) 60% 40%);
  --cell3:hsl(var(--hue) 64% 51%); --cell4:hsl(var(--hue) 68% 63%);
  --sh2:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
}
/* Glass themes (glass recipe). One CARD (.panel). The hue picker (.palette) expands inside the card rather than
   floating over it, so it takes the card's glass and no fill of its own. The heat-grid cells are data encoding,
   not glass, so --cell0..4 stay as they are in every theme. */
html[data-theme=frosted],html[data-theme=liquid]{
  --bg:transparent;
  background-image:var(--wall); background-attachment:fixed; background-size:cover;
}
html[data-theme=frosted]{
  --wall:url("frosted-backdrops/night-lines.png");
  --panel:rgba(255,255,255,.40); --panel2:rgba(18,24,36,.065);
  --line:rgba(18,24,36,.15); --line2:rgba(18,24,36,.10);
  --text:#14161c; --muted:#3c4250; --faint:#535865;
  --ink:#191b21; --on:#fff;
  --sh2:0 4px 14px rgb(255 255 255/5.5%);
}
html[data-theme=liquid]{
  --wall:url("liquid-backdrops/cool-wall.png");
  --panel:rgba(248,250,254,.78); --panel2:rgba(18,24,36,.075);
  --line:rgba(18,24,36,.16); --line2:rgba(18,24,36,.11);
  --text:#101319; --muted:#333846; --faint:#4a4f5e;
  --ink:#12151b; --on:#fff; --r-lg:22px;
  --sh2:0 1px 2px rgba(10,14,24,.14),0 22px 54px -20px rgba(10,14,24,.48);
}
html[data-theme=frosted] .panel{backdrop-filter:blur(var(--glass-blur,6px)) saturate(var(--glass-sat,120%));border-color:rgba(255,255,255,var(--glass-rim,.2))}
html[data-theme=liquid] .panel{background:transparent;border-color:rgba(255,255,255,var(--glass-rim,.1));backdrop-filter:blur(var(--glass-blur,6px)) contrast(1.05);box-shadow:var(--sh2)}
html[data-theme=liquid][data-refract] .panel{backdrop-filter:blur(var(--glass-blur,6px)) url(#lg-liquid)}
@media (prefers-reduced-transparency:reduce){
  html[data-theme=frosted],html[data-theme=liquid]{--panel:#fafbfd;--panel2:#f0f3f8;--line:#dde2ea;--line2:#e9edf3}
  html[data-theme=frosted] .panel,html[data-theme=liquid] .panel,html[data-theme=liquid][data-refract] .panel{backdrop-filter:none;background-image:none;border-color:var(--line)}
  html[data-theme=liquid] .panel{background:var(--panel)}
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);color:var(--text);background:var(--bg);min-height:100vh;padding:36px 14px}
button{font:inherit;color:inherit}
.panel{position:relative;width:380px;max-width:100%;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh2);padding:13px 14px 12px;overflow:visible}
.header{display:flex;align-items:center;min-height:22px}
.title{font-size:13px;font-weight:700}
.actions{display:flex;align-items:center;gap:3px;margin-left:auto}
.year{border:0;background:transparent;padding:3px 5px;border-radius:6px;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer}
.year:hover{background:var(--panel2);color:var(--text)}
.icon{display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--faint);cursor:pointer}
.icon:hover{background:var(--panel2);color:var(--text)}
.icon svg{width:14px;height:14px}
.summary{display:flex;align-items:baseline;gap:7px;margin-top:12px}
.summary strong{font-family:var(--mono);font-size:20px;line-height:1;font-weight:700}
.summary span{font-size:11px;color:var(--muted)}
.summary em{margin-left:auto;color:var(--faint);font-size:11px;font-style:normal}
.graph-wrap{margin-top:12px}
.month-labels{display:grid;grid-template-columns:18px repeat(53,minmax(0,1fr));height:12px;align-items:start;color:var(--faint);font-family:var(--mono);font-size:7px;line-height:1}
.month-labels span{white-space:nowrap}
.graph-row{display:grid;grid-template-columns:15px minmax(0,1fr);gap:4px}
.week-labels{display:grid;grid-template-rows:repeat(7,1fr);height:63px;color:var(--faint);font-size:7px;line-height:1;text-align:left}
.week-labels span{display:flex;align-items:center}
.grid{display:grid;grid-template-columns:repeat(53,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));grid-auto-flow:column;gap:1px;min-width:0}
.day{display:block;width:100%;aspect-ratio:1;border:0;border-radius:1px;background:var(--cell0);cursor:pointer;min-width:0}
.day[data-level="1"]{background:var(--cell1)}
.day[data-level="2"]{background:var(--cell2)}
.day[data-level="3"]{background:var(--cell3)}
.day[data-level="4"]{background:var(--cell4)}
.day[aria-pressed=true]{outline:1px solid var(--text);outline-offset:1px}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:7px;color:var(--faint);font-size:8px}
.swatch{display:block;width:8px;height:8px;border:0;border-radius:1px;background:var(--cell0);cursor:pointer;padding:0}
.swatch[data-level="1"]{background:var(--cell1)}
.swatch[data-level="2"]{background:var(--cell2)}
.swatch[data-level="3"]{background:var(--cell3)}
.swatch[data-level="4"]{background:var(--cell4)}
.swatch:hover,.swatch[aria-pressed=true]{outline:1px solid var(--text);outline-offset:1px}
.theme{position:fixed;top:12px;right:14px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font-size:11px;cursor:pointer}
.theme:hover{color:var(--text)}
.palette{margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);max-height:0;overflow:hidden;opacity:0;transition:max-height .18s ease,opacity .18s ease,padding-top .18s ease,border-color .18s ease}
.palette.open{max-height:200px;opacity:1}
.palette:not(.open){padding-top:0;border-top-color:transparent}
.palette-head{font-size:11px;font-weight:700}
.palette-body{display:flex;align-items:center;gap:13px;margin-top:9px}
.hue-wheel{position:relative;width:124px;height:124px;flex:none;rotate:var(--wheel-angle,0deg);transition:rotate .4s cubic-bezier(.2,.8,.2,1);animation:hue-wheel-in .28s cubic-bezier(.2,.8,.2,1)}
.hue-wheel::before{content:"";position:absolute;inset:12px;border-radius:50%;background:conic-gradient(#ef4444 0deg 30deg,#f97316 30deg 60deg,#eab308 60deg 90deg,#84cc16 90deg 120deg,#22c55e 120deg 150deg,#14b8a6 150deg 180deg,#06b6d4 180deg 210deg,#3b82f6 210deg 240deg,#6366f1 240deg 270deg,#8b5cf6 270deg 300deg,#d946ef 300deg 330deg,#ec4899 330deg 360deg);-webkit-mask-image:radial-gradient(circle,transparent 27px,#000 28px);mask-image:radial-gradient(circle,transparent 27px,#000 28px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
.hue-wheel::after{content:"";position:absolute;inset:34px;border:1px solid var(--line);border-radius:50%;background:var(--panel)}
.hue-core{position:absolute;z-index:1;inset:43px;display:grid;place-items:center;border-radius:50%;background:var(--panel2);color:var(--muted);font-size:9px;pointer-events:none;rotate:calc(var(--wheel-angle,0deg) * -1);transition:rotate .4s cubic-bezier(.2,.8,.2,1)}
.hue{position:absolute;z-index:2;left:50%;top:50%;width:21px;height:21px;border:2px solid var(--panel);border-radius:50%;background:hsl(var(--hue-value) 70% 52%);box-shadow:0 1px 3px rgba(20,20,26,.24);cursor:pointer;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-51px) rotate(calc(var(--angle) * -1));transition:transform .15s ease,box-shadow .15s ease}
.hue:hover,.hue[aria-pressed=true]{box-shadow:0 0 0 2px var(--text),0 2px 4px rgba(20,20,26,.26);transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-51px) rotate(calc(var(--angle) * -1)) scale(1.12)}
.shade-panel{min-width:0;flex:1;align-self:stretch;position:relative}
.shades{position:absolute;inset:0;display:flex;gap:5px}
.shade{position:relative;flex:1;height:100%;color:var(--faint);font-size:8px}
.shade i{position:absolute;left:0;right:0;top:50%;margin-top:-9px;height:18px;border-radius:3px;background:hsl(var(--palette-hue) 58% 84%)}
.shade>span{position:absolute;left:0;right:0;top:calc(50% + 13px);text-align:center}
.shade:nth-child(2) i{background:hsl(var(--palette-hue) 60% 64%)}
.shade:nth-child(3) i{background:hsl(var(--palette-hue) 64% 46%)}
.shade:nth-child(4) i{background:hsl(var(--palette-hue) 68% 30%)}
html[data-theme=dark] .shade:nth-child(1) i{background:hsl(var(--palette-hue) 58% 29%)}
html[data-theme=dark] .shade:nth-child(2) i{background:hsl(var(--palette-hue) 60% 40%)}
html[data-theme=dark] .shade:nth-child(3) i{background:hsl(var(--palette-hue) 64% 51%)}
html[data-theme=dark] .shade:nth-child(4) i{background:hsl(var(--palette-hue) 68% 63%)}
.icon:focus-visible,.day:focus-visible,.year:focus-visible,.swatch:focus-visible,.hue:focus-visible,.theme:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
@keyframes hue-wheel-in{from{opacity:0;transform:scale(.72) rotate(-22deg)}to{opacity:1;transform:none}}
@media(max-width:410px){body{padding-inline:10px}.panel{padding-inline:13px}.palette-body{gap:9px}.hue-wheel{width:116px;height:116px}.hue{transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-47px) rotate(calc(var(--angle) * -1))}.hue:hover,.hue[aria-pressed=true]{transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-47px) rotate(calc(var(--angle) * -1)) scale(1.12)}}
@media(prefers-reduced-motion:reduce){.palette{transition:none}.hue-wheel,.hue-core{animation:none;transition:none}.hue{transition:none}}
html.shot *{transition:none!important;animation:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="lg-liquid" filterUnits="userSpaceOnUse" x="0" y="0" width="380" height="186" color-interpolation-filters="sRGB">
    <feImage id="lg-map" x="0" y="0" width="380" height="186" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<button class="theme" id="theme" type="button">静谧暗夜</button>
<section class="panel" id="panel" aria-label="单词年度记录">
  <header class="header">
    <button class="icon" type="button" aria-label="返回词汇" title="返回词汇"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
    <span class="title" data-l="title"></span>
    <div class="actions"><button class="year" type="button" aria-label="查看 2026 年">2026</button><button class="icon" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  </header>
  <div class="summary"><strong>2026</strong><span id="dayDetail"></span><em id="total"></em></div>
  <div class="graph-wrap">
    <div class="month-labels" aria-hidden="true" id="monthLabels"></div>
    <div class="graph-row"><div class="week-labels" aria-hidden="true"><span></span><span data-l="mon"></span><span></span><span data-l="wed"></span><span></span><span data-l="fri"></span><span></span></div><div class="grid" id="grid"></div></div>
    <div class="legend" aria-label="颜色图例"><span data-l="less"></span><button class="swatch" type="button" data-level="0" aria-label="无记录，打开配色选择"></button><button class="swatch" type="button" data-level="1" aria-label="第 1 档，打开配色选择"></button><button class="swatch" type="button" data-level="2" aria-label="第 2 档，打开配色选择"></button><button class="swatch" type="button" data-level="3" aria-label="第 3 档，打开配色选择"></button><button class="swatch" type="button" data-level="4" aria-label="第 4 档，打开配色选择"></button><span data-l="more"></span></div>
  </div>
  <section class="palette" id="palette" hidden aria-label="选择年度记录配色">
    <header class="palette-head"><span data-l="cellColors"></span></header>
    <div class="palette-body">
      <div class="hue-wheel" id="hueWheel" aria-label="12 色相环"><span class="hue-core" id="hueCore">绿</span></div>
      <div class="shade-panel"><div class="shades"><span class="shade"><i></i><span data-l="shadeLight"></span></span><span class="shade"><i></i><span>1</span></span><span class="shade"><i></i><span>2</span></span><span class="shade"><i></i><span data-l="shadeDark"></span></span></div></div>
    </div>
  </section>
</section>
<script>
/// Reader-facing strings, one column per language, same shape as pet.html and words.html. The values
/// are the ones the application's language table holds for the same source strings (i18n/lens_*.ts,
/// context YearWordsPopup). Month names are not in that table, so they are the locale's short forms.
const L = {
  zh: { title: "单词年度记录", mon: "一", wed: "三", fri: "五", less: "少", more: "多", cellColors: "格子配色",
        wordsFmt: "%1 词", lookupsFmt: "%1：查阅 %2 次", cellAria: "%1，%2 词",        shadeLight: "浅", shadeDark: "深", themeDark: "静谧暗夜", themeLight: "晴朗白昼", themeFrosted: "雾面玻璃", themeLiquid: "流光玻璃",
        months: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
        hueNames: ['红','橙','黄','黄绿','绿','青绿','青','蓝','靛','紫','洋红','玫红'] },
  en: { title: "Year in words", mon: "Mon", wed: "Wed", fri: "Fri", less: "Less", more: "More", cellColors: "Cell colors",
        wordsFmt: "%1 words", lookupsFmt: "%1: %2 lookups", cellAria: "%1, %2 words",        shadeLight: "Light", shadeDark: "Dark", themeDark: "Dark", themeLight: "Light", themeFrosted: "Frosted glass", themeLiquid: "Liquid glass",
        months: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
        hueNames: ['Red','Orange','Yellow','Yellow green','Green','Teal','Cyan','Blue','Indigo','Violet','Magenta','Rose'] },
  ja: { title: "単語の年間記録", mon: "月", wed: "水", fri: "金", less: "少", more: "多", cellColors: "セルの色",
        wordsFmt: "%1 語", lookupsFmt: "%1：%2 回の検索", cellAria: "%1、%2 語",        shadeLight: "淡", shadeDark: "濃", themeDark: "ダーク", themeLight: "ライト", themeFrosted: "すりガラス", themeLiquid: "リキッドガラス",
        months: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
        hueNames: ['赤','オレンジ','黄','黄緑','緑','青緑','シアン','青','藍','紫','マゼンタ','ローズ'] },
  es: { title: "Año en palabras", mon: "Lun", wed: "Mié", fri: "Vie", less: "Menos", more: "Más", cellColors: "Colores de las celdas",
        wordsFmt: "%1 palabras", lookupsFmt: "%1: %2 consultas", cellAria: "%1, %2 palabras",        shadeLight: "Claro", shadeDark: "Oscuro", themeDark: "Oscuro", themeLight: "Claro", themeFrosted: "Vidrio mate", themeLiquid: "Vidrio líquido",
        months: ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],
        hueNames: ['Rojo','Naranja','Amarillo','Amarillo verdoso','Verde','Verde azulado','Cian','Azul','Índigo','Violeta','Magenta','Rosa'] }
};
const asked = (new URLSearchParams(location.search).get('lang') || 'zh').toLowerCase();
const lang = asked.startsWith('zh') ? 'zh' : (L[asked] ? asked : 'zh');
const t = L[lang];
document.documentElement.lang = { en: 'en', zh: 'zh-CN', ja: 'ja', es: 'es' }[lang];
for (const el of document.querySelectorAll('[data-l]')) el.textContent = t[el.dataset.l];

const year=2026;
const months=t.months;
const hues=t.hueNames.map((name,index)=>[name,index*30]);
const days=[];const counts=new Map();const key=date=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
for(let month=0;month<12;month++)for(let day=1;day<=new Date(year,month+1,0).getDate();day++){const date=new Date(year,month,day);const seed=(month*17+day*9+Math.floor(day/5))%17;const count=seed<8?0:seed<11?1:seed<14?2:seed<16?4:7;days.push(date);counts.set(key(date),count)}
document.getElementById('total').textContent=t.wordsFmt.replace('%1',[...counts.values()].reduce((sum,value)=>sum+value,0));
const level=count=>count===0?0:count===1?1:count<=3?2:count<=5?3:4;const mondayOffset=date=>(date.getDay()+6)%7;const offset=mondayOffset(new Date(year,0,1));const weekCount=Math.ceil((offset+days.length)/7);
const monthLabels=document.getElementById('monthLabels');monthLabels.style.gridTemplateColumns=`18px repeat(${weekCount},minmax(0,1fr))`;
months.forEach((month,index)=>{const label=document.createElement('span');label.textContent=month;const monthStart=days.findIndex(date=>date.getMonth()===index);label.style.gridColumn=`${Math.floor((offset+monthStart)/7)+2} / span 4`;monthLabels.append(label)});
const grid=document.getElementById('grid');grid.style.gridTemplateColumns=`repeat(${weekCount},minmax(0,1fr))`;
function choose(date,count){document.querySelectorAll('.day').forEach(day=>day.setAttribute('aria-pressed',String(day.dataset.date===key(date))));document.getElementById('dayDetail').textContent=t.lookupsFmt.replace('%1',key(date)).replace('%2',count)}
for(let week=0;week<weekCount;week++)for(let weekday=0;weekday<7;weekday++){const index=week*7+weekday-offset;const date=index>=0&&index<days.length?days[index]:null;if(!date){const blank=document.createElement('i');blank.className='day';blank.style.visibility='hidden';grid.append(blank);continue}const count=counts.get(key(date));const button=document.createElement('button');button.type='button';button.className='day';button.dataset.date=key(date);button.dataset.level=level(count);button.setAttribute('aria-pressed','false');button.setAttribute('aria-label',t.cellAria.replace('%1',key(date)).replace('%2',count));button.title=t.cellAria.replace('%1',key(date)).replace('%2',count);button.addEventListener('click',()=>choose(date,count));grid.append(button)}
choose(new Date(year,9,7),counts.get(key(new Date(year,9,7))));
const root=document.documentElement;const palette=document.getElementById('palette');const panel=document.getElementById('panel');const hueWheel=document.getElementById('hueWheel');const hueCore=document.getElementById('hueCore');let selectedHue=4;let wheelAngle=0;
hues.forEach(([name,hue],index)=>{const button=document.createElement('button');button.type='button';button.className='hue';button.style.setProperty('--hue-value',hue);button.style.setProperty('--angle',`${index*30}deg`);button.dataset.index=index;button.setAttribute('aria-label',name);button.setAttribute('aria-pressed',String(index===selectedHue));button.addEventListener('click',()=>applyHue(index));hueWheel.append(button)});
function applyHue(index){selectedHue=index;const [name,hue]=hues[index];root.style.setProperty('--hue',hue);root.style.setProperty('--palette-hue',hue);hueCore.textContent=name;document.querySelectorAll('.hue').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.index)===index)));/* 选中的色相滚到顺时针 90°；取与当前转角最近的等价角，免得为了几度倒转大半圈 */const target=90-hue;wheelAngle+=((target-wheelAngle)%360+540)%360-180;hueWheel.style.setProperty('--wheel-angle',`${wheelAngle}deg`)}
function openPalette(){palette.hidden=false;panel.classList.add('palette-open');sizeRefract(panel,'lg-liquid','lg-map');requestAnimationFrame(()=>palette.classList.add('open'));document.querySelector('.swatch[aria-pressed=true]')?.focus()}
function closePalette(){palette.classList.remove('open');panel.classList.remove('palette-open');setTimeout(()=>{if(!palette.classList.contains('open')){palette.hidden=true;sizeRefract(panel,'lg-liquid','lg-map')}},180)}
document.querySelectorAll('.swatch').forEach(swatch=>swatch.addEventListener('click',()=>{const shut=!palette.hidden&&swatch.getAttribute('aria-pressed')==='true';document.querySelectorAll('.swatch').forEach(item=>item.setAttribute('aria-pressed',String(item===swatch)));shut?closePalette():openPalette()}));
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!palette.hidden)closePalette()});
applyHue(selectedHue);

/// 折射能力探测：不支持 url() 形式 backdrop-filter 的浏览器会丢掉这条声明，读回空串。此时液体玻璃退回 CSS 的模糊与高光。
const refractOK = (() => { const p = document.createElement("div"); p.style.backdropFilter = "url(#lg-liquid)"; return p.style.backdropFilter !== ""; })();
const svgAttr = (id, name, v) => document.getElementById(id).setAttribute(name, v);
/// 按卡片尺寸画一次位移图（R/G 编码到 [0,255]，128 为零位移）。位移取模糊后的圆角矩形遮罩的梯度：
/// 遮罩在边缘最陡、向中心趋于平坦，梯度处处连续，所以没有距离场那样沿对角线（两条边的等距线）翻转的接缝，不会画出 X 形。
/// 位移朝内取样：边缘的像素从玻璃里面借内容，边缘因此被压弯；位移的强度由 feDisplacementMap 的 scale 决定，不在这里烤死。
function liquidMap(W = 380, H = 480, R = 22, S = 18) {
  const mask = document.createElement("canvas");
  mask.width = W; mask.height = H;
  const mctx = mask.getContext("2d");
  mctx.filter = `blur(${S}px)`;
  mctx.fillStyle = "#fff";
  mctx.beginPath(); mctx.roundRect(0, 0, W, H, R); mctx.fill();
  const m = mctx.getImageData(0, 0, W, H).data;
  // 读 alpha：白色填充的 RGB 恒为 255，模糊后的梯度只在 alpha 里
  const at = (x, y) => m[(Math.min(Math.max(y, 0), H - 1) * W + Math.min(Math.max(x, 0), W - 1)) * 4 + 3] / 255;
  // 遮罩向内升高，中心差分即朝内的梯度；按全图最大值归一，最强处正好编码到 127
  const gx = new Float32Array(W * H), gy = new Float32Array(W * H);
  let max = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    gx[i] = (at(x + 1, y) - at(x - 1, y)) / 2;
    gy[i] = (at(x, y + 1) - at(x, y - 1)) / 2;
    max = Math.max(max, Math.hypot(gx[i], gy[i]));
  }
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d"), img = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) img.data.set([128 + 127 * gx[i] / max, 128 + 127 * gy[i] / max, 128, 255], i * 4);
  ctx.putImageData(img, 0, 0);
  return canvas.toDataURL();
}
// Map size follows the card's current box: the panel grows when the hue picker opens. R is read back from the
// card's computed corner radius (22 px on the liquid panel) so the map cannot drift from the border; S scales
// with width from the settings card (380 px -> 18).
function sizeRefract(card, filter, map) {
  const W = card.offsetWidth, H = card.offsetHeight;
  if (document.documentElement.dataset.refract !== 'on' || !W) return;
  const R = parseFloat(getComputedStyle(card).borderTopLeftRadius);
  for (const id of [filter, map]) { const n = document.getElementById(id); n.setAttribute('width', W); n.setAttribute('height', H); }
  svgAttr(map, 'href', liquidMap(W, H, R, Math.round(18 * W / 380)));
}
