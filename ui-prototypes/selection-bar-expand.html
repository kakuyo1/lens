<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 选区动作条 · 复制展开</title>
<style>
:root{
  --bg:#e9ebef; --panel:#fff; --panel2:#f1f3f7; --line:#d6dae1; --line2:#e6e9ee;
  --text:#1a1a1f; --muted:#66666f; --faint:#73737d;
  --ink:#1a1a1f; --on:#fff; --sel:rgba(26,26,31,.16);
  --r-bar:13px; --r-item:9px; --r-tray:11px;
  --sh2:0 2px 6px rgba(20,20,26,.06),0 24px 60px -24px rgba(20,20,26,.24);
  --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
  --read:"Charter","Iowan Old Style","Sitka Text",Georgia,serif;
  --stage:var(--panel);
  --glass-blur:6px; --glass-sat:120%; --glass-rim:.2;
  --chrome-text:#1a1a1f; --chrome-muted:#66666f; --chrome-faint:#73737d;
  --chrome-chip:var(--panel2); --chrome-chip-line:var(--line);
}
html[data-theme=dark]{
  --bg:#0b0e13; --panel:#171c25; --panel2:#212936; --line:#36404e; --line2:#242b37;
  --text:#e9edf3; --muted:#a8b3c2; --faint:#8a95a6;
  --ink:#eef3fa; --on:#0c1016; --sel:rgba(233,237,243,.16);
  --sh2:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
  --chrome-text:#e9edf3; --chrome-muted:#a8b3c2; --chrome-faint:#8a95a6;
  --stage:var(--bg);
}
html[data-theme=frosted],html[data-theme=liquid]{
  --bg:transparent; --stage:transparent;
  /* 与 selection-bar-variants.html 同一张浅色底图，四种主题的对照读得出来。 */
  --wall:url("frosted-backdrops/sky-light.png");
  --chrome-muted:#303845; --chrome-faint:#48505c;
  --chrome-chip:rgba(255,255,255,.34); --chrome-chip-line:rgba(255,255,255,.58);
  background:var(--wall) center / cover fixed no-repeat;
}
html[data-theme=frosted] .reader,html[data-theme=liquid] .reader{
  max-width:584px; padding:18px 22px; border:1px solid rgba(255,255,255,.55); border-radius:14px;
  background:rgba(255,255,255,.84); box-shadow:0 2px 14px rgba(20,30,50,.10);
}
html[data-theme=frosted]{
  --panel:rgba(255,255,255,.40); --panel2:rgba(18,24,36,.065);
  --line:rgba(18,24,36,.15); --line2:rgba(18,24,36,.10);
  --text:#14161c; --muted:#3c4250; --faint:#535865;
  --ink:#191b21; --on:#fff;
  --sh2:0 4px 14px rgb(255 255 255/5.5%);
}
html[data-theme=liquid]{
  --panel:rgba(248,250,254,.78); --panel2:rgba(18,24,36,.075);
  --line:rgba(18,24,36,.16); --line2:rgba(18,24,36,.11);
  --text:#101319; --muted:#333846; --faint:#4a4f5e;
  --ink:#12151b; --on:#fff;
  --sh2:0 1px 2px rgba(10,14,24,.14),0 22px 54px -20px rgba(10,14,24,.48);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);color:var(--chrome-text);background:var(--bg);min-height:100vh}
::selection{background:var(--sel)}
button{font:inherit;color:inherit}

.wrap{width:min(1180px,calc(100vw - 96px));margin-inline:auto}
header{padding:48px 0 22px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.wordmark{font-size:12.5px;font-weight:700;letter-spacing:.01em}
.wordmark span{color:var(--chrome-muted);font-weight:400;margin-left:9px}
.controls{display:flex;align-items:center;gap:8px}
.langs,.seg{display:flex;align-items:center;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.langs button,.seg button{height:24px;min-width:29px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;transition:background-color .15s,color .15s}
.langs button:hover,.seg button:hover{color:var(--text)}
.langs button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--ink);color:var(--on)}
.themebtn{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font-size:11.5px;cursor:pointer}
.themebtn:hover{color:var(--text)}
h1{max-width:820px;margin-top:50px;font-size:clamp(34px,4.2vw,52px);line-height:1.06;letter-spacing:-.03em;font-weight:700}
.lede{max-width:680px;margin-top:18px;font-size:15px;line-height:1.75;color:var(--chrome-muted)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;margin-top:26px}
.ctl .grp{display:flex;align-items:center;gap:8px}
.ctl .grp > span{font-size:11.5px;color:var(--chrome-faint)}

main{padding-bottom:26px}
.spec{display:grid;grid-template-columns:272px minmax(0,1fr);gap:52px;align-items:start;padding:38px 0 54px}
.kicker{display:flex;align-items:center;gap:10px}
.letter{width:23px;height:23px;display:grid;place-items:center;border:1px solid var(--chrome-chip-line);border-radius:7px;background:var(--chrome-chip);color:var(--chrome-muted);font-size:11px;font-weight:700;flex:none}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.idea{margin-top:12px;font-size:13.5px;line-height:1.7;color:var(--chrome-muted)}
.notes{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px 10px;margin-top:22px}
.notes dt{font-size:11px;line-height:1.65;color:var(--chrome-faint)}
.notes dd{font-size:12.5px;line-height:1.65;color:var(--chrome-muted)}

.stage{position:relative;min-height:var(--mh,320px);padding:var(--pt,150px) 32px 42px;border-radius:18px;background:var(--stage)}
.stage.edge{--pt:24px !important}
.reader{max-width:540px}
.sample{font-family:var(--read);font-size:16.5px;line-height:1.75;letter-spacing:.002em;color:var(--chrome-muted)}
.sel{background:var(--sel);border-radius:3px;color:var(--chrome-text);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.status{position:absolute;right:24px;bottom:14px;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:var(--ink);color:var(--on);font-size:11px;font-weight:700;opacity:0;transform:translateY(3px);transition:opacity .18s,transform .18s;pointer-events:none}
.status.show{opacity:1;transform:none}
.status svg{width:12px;height:12px;flex:none}

/* ——— the bar ——— */
.bar{position:absolute;z-index:5;display:flex;align-items:center;opacity:0;pointer-events:none;user-select:none;-webkit-user-select:none;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-bar);box-shadow:var(--sh2);transition:opacity .15s}
.bar.on{opacity:1;pointer-events:auto}
.act{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid transparent;border-radius:var(--r-item);background:transparent;color:var(--text);font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer;transition:background-color .15s,color .15s,transform .15s}
.act svg{width:15px;height:15px;color:var(--muted);flex:none}
.act:hover{background:var(--panel2)}
.act:active{transform:scale(.97)}
.act:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.act .caret{width:9px;height:9px;margin-left:1px;opacity:0;transition:opacity .15s,transform .15s}

/* Copy 的展开：子项抽屉。位置由 copy-wrap 的 up/down 与 end/center/full 决定。 */
.copy-wrap{position:relative;display:flex}
.tray{position:absolute;display:flex;flex-direction:column;gap:2px;width:auto;min-width:max-content;padding:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-tray);box-shadow:var(--sh2);
  opacity:0;pointer-events:none;transform:translateY(var(--ty,0));transition:opacity .15s,transform .15s}
.tray::before{content:"";position:absolute;left:0;right:0;height:10px}
.tray .act{padding:7px 10px}
.tray .act.off{display:none}
.copy-wrap.up .tray{bottom:calc(100% + 6px);--ty:4px}
.copy-wrap.up .tray::before{top:100%}
.copy-wrap.down .tray{top:calc(100% + 6px);--ty:-4px}
.copy-wrap.down .tray::before{bottom:100%}
.copy-wrap.end .tray{right:0}
.copy-wrap.center .tray{left:50%;margin-left:-84px}
.copy-wrap.full .tray{left:0;right:0;width:auto}
.copy-wrap.up .caret{transform:rotate(180deg)}
.copy-wrap:not(.none) .caret{opacity:.8}
.copy-wrap.open:not(.none) .tray{opacity:1;pointer-events:auto;transform:none}
.copy-wrap.none .tray{display:none}
.shot .tray, .shot .tray .act{transition:none}
html[data-theme=frosted] .tray{backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat))}
html[data-theme=liquid] .tray{background:rgba(248,250,254,.34);backdrop-filter:blur(var(--glass-blur)) contrast(1.05)}

/* A · 经典长条（默认）：复制在右端 */
.bar-bar{padding:5px}
.bar-bar .copy-wrap{display:flex}

/* B · 页边签：竖排，复制在最下一格，抽屉顺着书签往下接 */
.bar-tab{flex-direction:column;align-items:stretch;gap:2px;padding:5px 6px 5px 9px}
.bar-tab .spine{position:absolute;left:4px;top:9px;bottom:9px;width:1px;background:var(--line)}
.bar-tab .act{justify-content:flex-start;padding:7px 10px;border-radius:8px}
.bar-tab .fold{position:absolute;right:1px;bottom:1px;width:0;height:0;border-left:9px solid transparent;border-bottom:9px solid var(--panel2);pointer-events:none}
/* 抽屉是第二枚书签：外形与页边签一致，书脊与折角沿用上面两条规则。 */
.bar-tab .tray-tab{padding:5px 6px 5px 9px;border-radius:var(--r-bar)}

/* C · 手牌签：三张牌，复制是最右一张，抽屉向上摊开 */
.bar-hand{padding:4px 0 6px;border-radius:0;background:transparent;border-color:transparent;box-shadow:none}
.bar-hand .hand{display:flex;align-items:center}
.bar-hand .slot-wrap{position:relative;width:84px;height:64px}
.bar-hand .slot-wrap + .slot-wrap{margin-left:-7px}
.bar-hand .slot{position:absolute;inset:0;padding:0;border:0;background:none;cursor:pointer}
.bar-hand .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 5px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);box-shadow:0 2px 8px rgba(20,20,26,.08);transform:rotate(var(--rot,0deg)) translateY(var(--dy,0px));transform-origin:50% 75%;transition:transform .2s cubic-bezier(.2,.8,.25,1),background-color .15s,border-color .15s}
.bar-hand .slot-wrap:nth-child(1) .face{--rot:-6deg;--dy:2px}
.bar-hand .slot-wrap:nth-child(2) .face{--rot:0deg;--dy:-2px}
.bar-hand .slot-wrap:nth-child(3) .face{--rot:6deg;--dy:2px}
.bar-hand .slot-wrap:nth-child(3){z-index:2}
.bar-hand .slot:hover .face,.bar-hand .slot:focus-visible .face{transform:rotate(0deg) translateY(-6px) scale(1.035);background:var(--panel);border-color:var(--muted)}
.bar-hand .slot:focus-visible{outline:none}
.bar-hand .slot:focus-visible .face{outline:2px solid var(--text);outline-offset:2px}
.bar-hand .face svg{width:15px;height:15px;color:var(--muted);flex:none}
.bar-hand .face .label{font-size:11px;line-height:1.25;font-weight:700;color:var(--text);text-align:center}
.bar-hand .caret{display:none}
.bar-hand .copy-wrap .tray{width:168px}
/* 抽屉是两张小牌，从复制牌上方摊开；牌面与手牌同样式，没有背板。 */
.bar-hand .tray-hand{flex-direction:row;align-items:center;justify-content:center;gap:0;width:168px;padding:0;border:0;background:none;box-shadow:none;backdrop-filter:none}
.bar-hand .tray-hand .act{width:84px;height:64px;flex-direction:column;justify-content:center;gap:5px;margin:0 -4px;padding:6px 5px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);box-shadow:0 2px 8px rgba(20,20,26,.08);font-size:11px;font-weight:700;line-height:1.25;white-space:normal;text-align:center;transition:transform .2s cubic-bezier(.2,.8,.25,1),background-color .15s,border-color .15s}
.bar-hand .tray-hand .act svg{width:15px;height:15px;color:var(--muted)}
.copy-wrap:not(.open) .tray-hand .act{transform:translateY(12px) scale(.9)}
.copy-wrap.open .tray-hand .act[data-n="0"]{transform:rotate(-6deg) translateY(2px)}
.copy-wrap.open .tray-hand .act[data-n="1"]{transform:rotate(6deg) translateY(2px)}
.copy-wrap.open .tray-hand.solo .act[data-n="0"]{transform:none}
.copy-wrap.open .tray-hand .act:hover,.copy-wrap.open .tray-hand.solo .act:hover{transform:translateY(-6px) scale(1.035);background:var(--panel);border-color:var(--muted)}
html[data-theme=frosted] .bar-hand .tray-hand,html[data-theme=liquid] .bar-hand .tray-hand{background:none;border:0;box-shadow:none;backdrop-filter:none}
html[data-theme=frosted] .bar-hand,html[data-theme=liquid] .bar-hand,
html[data-theme=frosted] .bar-fan,html[data-theme=liquid] .bar-fan{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}

/* D · 吊牌签：一根细线系到选区，整张牌微微倾斜 */
.bar-tag{--tilt:1.4deg;padding:6px 8px 6px 31px;border-radius:12px;transform:rotate(var(--tilt));transform-origin:15px 11px}
.bar-tag .string{position:absolute;left:14.5px;top:-16px;width:1.5px;height:26px;background:var(--muted);pointer-events:none}
.bar-tag .string::before{content:"";position:absolute;left:-1.5px;top:-2px;width:4.5px;height:4.5px;border-radius:50%;background:var(--muted)}
.bar-tag .hole{position:absolute;left:8px;top:4px;width:14px;height:14px;border:2px solid var(--line);border-radius:50%;background:var(--panel);pointer-events:none}
.bar-tag .hole::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--panel2)}
.bar-tag .act{padding:7px 9px;border-radius:8px}
/* 抽屉是第二张吊牌：细线从复制下缘垂下，孔位在上缘；不再摆正，跟着吊牌的倾斜一起走。 */
.bar-tag .copy-wrap .tray-tag{left:0;right:auto;width:168px;padding:6px 8px 6px 31px;border-radius:12px}
.bar-tag .copy-wrap.down .tray-tag{top:calc(100% + 16px)}
.bar-tag .copy-wrap.up .tray-tag{bottom:calc(100% + 16px)}
.bar-tag .tray-tag::before{height:16px}
.bar-tag .copy-wrap.up .tray-tag .string{top:auto;bottom:-16px}
.bar-tag .copy-wrap.up .tray-tag .string::before{top:auto;bottom:-2px}
.bar-tag .copy-wrap.up .tray-tag .hole{top:auto;bottom:4px}

/* E · 扇面：三片扇骨，复制是右片，抽屉以右片为轴 */
.bar-fan{display:block;width:260px;height:170px;padding:0;border-color:transparent;background:transparent;box-shadow:none;filter:drop-shadow(0 2px 6px rgba(20,20,26,.10)) drop-shadow(0 0 .8px var(--line))}
.bar-fan .blade{position:absolute;inset:0;padding:0;border:0;background:var(--panel2);cursor:pointer;transition:background-color .15s;z-index:1}
.bar-fan .blade-l{clip-path:polygon(130px 150px,10px 87px,78px 26px)}
.bar-fan .blade-c{clip-path:polygon(130px 150px,78px 26px,182px 26px);background:var(--panel);z-index:2}
.bar-fan .blade-r{clip-path:polygon(130px 150px,182px 26px,250px 87px)}
html[data-theme=light] .bar-fan .blade-l,html[data-theme=light] .bar-fan .blade-r{background:var(--bg)}
html[data-theme=light] .bar-fan .blade-l:hover,html[data-theme=light] .bar-fan .blade-r:hover{background:var(--panel)}
html[data-theme=light] .bar-fan .blade-c:hover{background:var(--panel2)}
.bar-fan .blade:hover{background:var(--panel)}
.bar-fan .blade:active{filter:brightness(.96)}
.bar-fan .blade:focus-visible{outline:none;background:var(--panel)}
.bar-fan .blade-face{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;transform:translate(-50%,-50%);pointer-events:none;text-align:center}
.bar-fan .blade-l .blade-face{left:62px;top:80px}
.bar-fan .blade-c .blade-face{left:130px;top:76px;width:54px}
.bar-fan .blade-r .blade-face{left:198px;top:80px}
.bar-fan .blade-face svg{width:16px;height:16px;color:var(--muted)}
.bar-fan .blade-face .label{font-size:11.5px;line-height:1.2;font-weight:700;color:var(--text)}
.bar-fan .blade:hover .blade-face{transform:translate(-50%,-50%) translateY(-2px)}
.bar-fan .fan-edge{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.bar-fan .fan-edge path{fill:none;stroke:var(--line);stroke-width:1}
.bar-fan .handle{position:absolute;left:50%;bottom:-4px;width:8px;height:18px;border-radius:4px;background:var(--line);transform:translateX(-50%);z-index:3;pointer-events:none}
.bar-fan .rivet{position:absolute;left:50%;bottom:13px;width:11px;height:11px;border:1px solid var(--line);border-radius:50%;background:var(--panel);transform:translateX(-50%);z-index:4;pointer-events:none}
/* 扇面的复制层铺满整把扇子但不接指针；真正接指针的是右片本身，抽屉另算。 */
.bar-fan .copy-wrap{position:absolute;inset:0;pointer-events:none;display:block}
.bar-fan .copy-wrap .blade{pointer-events:auto}
/* 抽屉是一把小扇，铆在复制右片的外角（右下），朝右侧展开；两片扇骨沿用大扇的线，只有一项时是一片。 */
.bar-fan .copy-wrap .tray-fan{left:250px;top:auto;bottom:83px;right:auto;width:140px;height:140px;padding:0;border:0;background:none;box-shadow:none;backdrop-filter:none;gap:0;filter:drop-shadow(0 2px 6px rgba(20,20,26,.10)) drop-shadow(0 0 .8px var(--line))}
.bar-fan .copy-wrap .tray-fan::before{top:0;bottom:0;left:-12px;right:auto;width:12px;height:auto}
.bar-fan .copy-wrap .tray-fan .sub-edge{position:absolute;inset:0;width:140px;height:140px;pointer-events:none}
.bar-fan .copy-wrap .tray-fan .sub-edge path{fill:none;stroke:var(--line);stroke-width:1}
.bar-fan .copy-wrap .tray-fan.solo .sub-edge{display:none}
.bar-fan .copy-wrap .tray-fan .sub-rivet{position:absolute;left:-5px;bottom:-5px;width:10px;height:10px;border:1px solid var(--line);border-radius:50%;background:var(--panel);pointer-events:none}
.bar-fan .copy-wrap .tray-fan .act{position:absolute;inset:0;width:140px;height:140px;padding:0;border:0;border-radius:0;background:none;box-shadow:none}
/* The blade is painted by a clipped pseudo-element, so the label is never clipped with it. */
.bar-fan .copy-wrap .tray-fan .act::before{content:"";position:absolute;inset:0;background:var(--panel);clip-path:polygon(0 140px,140px 140px,99px 41px);transition:background-color .15s}
.bar-fan .copy-wrap .tray-fan .act:hover::before{background:var(--panel2)}
.bar-fan .copy-wrap .tray-fan .act[data-n="0"]{--cx:78px;--cy:118px}
.bar-fan .copy-wrap .tray-fan .act[data-n="1"]{--cx:36px;--cy:54px}
.bar-fan .copy-wrap .tray-fan .act[data-n="1"]::before{clip-path:polygon(0 140px,99px 41px,0 0)}
.bar-fan .copy-wrap .tray-fan .stack{position:absolute;left:var(--cx);top:var(--cy);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;white-space:normal;font-size:11px;font-weight:700;line-height:1.2;color:var(--text);text-align:center;pointer-events:none}
html[data-theme=frosted] .bar-fan .copy-wrap .tray-fan,html[data-theme=liquid] .bar-fan .copy-wrap .tray-fan{background:none;border:0;box-shadow:none;backdrop-filter:none}
.bar-fan .copy-wrap .caret{display:none}

/* 玻璃主题：卡片取玻璃，同 selection-bar-variants.html */
html[data-theme=frosted] .bar{border-color:rgba(255,255,255,var(--glass-rim));backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat))}
html[data-theme=liquid] .bar{background:rgba(248,250,254,.34);border-color:rgba(255,255,255,.38);backdrop-filter:blur(var(--glass-blur)) contrast(1.05)}

footer{padding:22px 0 54px;color:var(--chrome-faint);font-size:11.5px;line-height:1.7}
footer p{max-width:760px}

@media (max-width:1040px){
  .spec{grid-template-columns:224px minmax(0,1fr);gap:34px}
  .stage{padding-left:26px;padding-right:26px}
}
@media (max-width:900px){
  .wrap{width:calc(100vw - 48px)}
  header{padding-top:34px}
  h1{margin-top:40px}
  .spec{grid-template-columns:1fr;gap:24px;padding:30px 0 46px}
}
@media (max-width:600px){
  .wrap{width:calc(100vw - 32px)}
  .topline{align-items:flex-start}
  h1{margin-top:32px;font-size:32px}
  .lede{font-size:14px}
  .sample{font-size:15.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<header class="wrap">
  <div class="topline">
    <div class="wordmark">Lens <span>选区动作条 · 复制展开</span></div>
    <div class="controls">
      <div class="langs" role="group" aria-label="界面语言">
        <button type="button" data-lang="zh" aria-pressed="true">中</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ja" aria-pressed="false">日</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
      <button class="themebtn" id="tb" type="button">晴朗白昼</button>
    </div>
  </div>
  <h1>复制按钮悬浮，展开只留适用的</h1>
  <p class="lede">复制还是一个按钮；鼠标悬浮后，朝离开选区的一侧探出抽屉，里面只有当前选区能用的几项。五种形态各画一份。下面两组开关切换选区形状与位置，看抽屉怎么跟着变。</p>
  <div class="ctl">
    <div class="grp" role="group" aria-label="选区形状">
      <span>选区</span>
      <div class="seg">
        <button type="button" data-kind="word" aria-pressed="false">词</button>
        <button type="button" data-kind="unknown" aria-pressed="false">词表外</button>
        <button type="button" data-kind="phrase" aria-pressed="false">专名</button>
        <button type="button" data-kind="sentence" aria-pressed="false">句子</button>
        <button type="button" data-kind="chinese" aria-pressed="false">中文</button>
      </div>
    </div>
    <div class="grp" role="group" aria-label="选区位置">
      <span>位置</span>
      <div class="seg">
        <button type="button" data-edge="centre" aria-pressed="true">居中</button>
        <button type="button" data-edge="top" aria-pressed="false">靠近上缘</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="wrap">
  <p>设计对照稿：抽屉的显隐只由悬浮与按压决定；读屏按压复制文本即展开抽屉，抽屉没有键盘入口（窗口不接管焦点）；契约见 UI-SPEC 4.10 与 docs/adr/0129。适用规则随选区形状，不随界面语言变。</p>
</footer>

<script>
/// Interface strings. The three new items are proposed names, not yet in i18n/lens_*.ts.
const L = {
  en: { translate: "Translate", explain: "Explain", copy: "Copy text", fixSpelling: "Fix spelling", fixSyntax: "Fix syntax", breakdown: "Breakdown", themeDark: "Dark", themeLight: "Light", themeFrosted: "Frosted glass", themeLiquid: "Liquid glass" },
  zh: { translate: "翻译", explain: "解释", copy: "复制文本", fixSpelling: "纠正拼写", fixSyntax: "纠正语法", breakdown: "句子拆解", themeDark: "静谧暗夜", themeLight: "晴朗白昼", themeFrosted: "雾面玻璃", themeLiquid: "流光玻璃" },
  ja: { translate: "翻訳", explain: "解説", copy: "テキストをコピー", fixSpelling: "スペルを直す", fixSyntax: "文法を直す", breakdown: "文の分解", themeDark: "ダーク", themeLight: "ライト", themeFrosted: "すりガラス", themeLiquid: "リキッドガラス" },
  es: { translate: "Traducir", explain: "Explicar", copy: "Copiar texto", fixSpelling: "Corregir ortografía", fixSyntax: "Corregir gramática", breakdown: "Análisis sintáctico", themeDark: "Oscuro", themeLight: "Claro", themeFrosted: "Vidrio mate", themeLiquid: "Vidrio líquido" }
};
const KINDS = ["word", "unknown", "phrase", "sentence", "chinese"];
/// [before, selected, after]. The reader is the page the reader is on, so it stays English (or Chinese for the Chinese case).
const SAMPLE = {
  word:     ["She gave a ", "candid", " answer to a question she had been dreading for weeks."],
  unknown:  ["Please ", "recieve", " the package before noon on Friday, or the courier will return it."],
  phrase:   ["The team is moving to ", "Kubernetes Operator", " this quarter, starting with the staging cluster."],
  sentence: ["", "Although the rain had stopped, the streets remained flooded for hours.", " Nobody came out until the afternoon."],
  chinese:  ["", "房间里一下子安静下来，她终于说出了那句准备了很久的话", "。"]
};
const ICON = {
  translate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5h9"/><path d="M7.5 3.5v2"/><path d="M10.5 5.5c0 4-2.6 7.4-6.5 8.9"/><path d="M5 9.6c1.2 2.3 3.1 4.1 5.3 5.1"/><path d="M12.6 20.5l3.7-9 3.7 9"/><path d="M14 17.4h4.6"/></svg>',
  explain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.6C10.4 5.2 8.3 4.5 5.5 4.5H4v13h1.5c2.8 0 4.9.7 6.5 2.1"/><path d="M12 6.6c1.6-1.4 3.7-2.1 6.5-2.1H20v13h-1.5c-2.8 0-4.9.7-6.5 2.1"/><path d="M12 6.6v13"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v8.5A1.5 1.5 0 0 0 5 15h.5"/></svg>',
  fixSpelling: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5 7.5 3.8 11 9.5M5.3 7.6h4.4"/><path d="M3.5 19.5c1.5-1.1 3-1.1 4.5 0s3 1.1 4.5 0 3-1.1 4.5 0 2.5.8 3.5.2"/></svg>',
  fixSyntax: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l3.9-.9L18.7 8a2.1 2.1 0 0 0-3-3L5.4 15.6z"/><path d="M14.6 6.6l2.8 2.8"/></svg>',
  breakdown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v4.5M12 8.5 6.5 12.5M12 8.5l5.5 4M6.5 12.5v7M17.5 12.5v7"/></svg>'
};
const CARET = '<svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.4 3.6 5 6.2l2.6-2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l4.6 4.5 10-10"/></svg>';

/// Applicability by selection kind: which tray items the copy button shows (the rule the spec will carry).
const ITEM_KINDS = { fixSpelling: "word unknown", fixSyntax: "sentence", breakdown: "sentence" };

function act(id) {
  return `<button type="button" class="act" data-action="${id}">${ICON[id]}<span data-l="${id}"></span></button>`;
}
function item(id, stacked = false) {
  const inner = `${ICON[id]}<span data-l="${id}"></span>`;
  return `<button type="button" class="act" data-action="${id}" data-kinds="${ITEM_KINDS[id]}">${stacked ? `<span class="stack">${inner}</span>` : inner}</button>`;
}
/// The drawer under the copy button. Each form draws its own (tray-<form>); the classic bar keeps the plain menu.
function tray(form = "") {
  const extra = {
    tab: '<span class="spine" aria-hidden="true"></span><span class="fold" aria-hidden="true"></span>',
    tag: '<span class="string" aria-hidden="true"></span><span class="hole" aria-hidden="true"></span>',
    fan: '<svg class="sub-edge" viewBox="0 0 140 140" aria-hidden="true"><path d="M0 140 L99 41"/></svg><span class="sub-rivet" aria-hidden="true"></span>'
  }[form] || "";
  const cls = form ? ` tray-${form}` : "";
  const stacked = form === "fan";
  return `<div class="tray${cls}" role="menu">${extra}${item("fixSpelling", stacked)}${item("fixSyntax", stacked)}${item("breakdown", stacked)}</div>`;
}
function copyAct() {
  return `<button type="button" class="act" data-copy data-action="copy">${ICON.copy}<span data-l="copy"></span>${CARET}</button>`;
}
function slot(id) {
  return `<div class="slot-wrap"><button type="button" class="slot" data-action="${id}"><span class="face">${ICON[id]}<span class="label" data-l="${id}"></span></span></button></div>`;
}
function blade(id, cls) {
  return `<button type="button" class="blade ${cls}" data-action="${id}"><span class="blade-face">${ICON[id]}<span class="label" data-l="${id}"></span></span></button>`;
}

/// One stage per form. `pt` is the room above the selection the form needs for its tray.
const FORMS = {
  bar:  { letter: "A", name: "经典长条（默认）", idea: "默认形态不变，只让复制多一个抽屉：右端的复制向上或向下探出适用的几项。", pt: 150, mh: 330,
          notes: [["适合", "默认形态，读者最熟；抽屉只在悬浮时出现，不占平时的宽度。"], ["代价", "抽屉要占一块上方或下方的空间，窄窗口里会压住相邻的行。"], ["展开", "贴复制右缘，朝离开选区的一侧；那一侧放不下就翻到靠选区的一侧。"]],
          markup: () => `${act("translate")}${act("explain")}<div class="copy-wrap end">${copyAct()}${tray()}</div>`,
          cls: "bar-bar" },
  tab:  { letter: "B", name: "页边签", idea: "复制是书签的最下一格，抽屉顺着书签往下接，像再夹进一枚书签。", pt: 120, mh: 400,
          notes: [["适合", "单行选区；书签本来就贴着页边，抽屉不压正文。"], ["代价", "抽屉往下接，长段落里要留出下方的空位；放不下时翻到上方，压住前两项。"], ["展开", "与复制同宽，贴复制下缘。"]],
          markup: () => `<span class="spine" aria-hidden="true"></span>${act("translate")}${act("explain")}<div class="copy-wrap full">${copyAct()}${tray("tab")}</div><span class="fold" aria-hidden="true"></span>`,
          cls: "bar-tab" },
  hand: { letter: "C", name: "手牌签", idea: "复制那张牌上再摊开两张小牌，朝上摊开，像再抽一手。", pt: 210, mh: 380,
          notes: [["适合", "三项都是大靶子；抽屉朝上摊开，与手牌的方向一致。"], ["代价", "抽屉与手牌本身同样高，上方不够时翻到下方，压住选区。"], ["展开", "以复制牌为轴，居中于牌的上方。"]],
          markup: () => `<div class="hand">${slot("translate")}${slot("explain")}<div class="slot-wrap copy-wrap center"><button type="button" class="slot" data-copy data-action="copy"><span class="face">${ICON.copy}<span class="label" data-l="copy"></span></span></button>${tray("hand")}</div></div>`,
          cls: "bar-hand" },
  tag:  { letter: "D", name: "吊牌签", idea: "复制下方再挂一张小签，用同样的细线系着，两张吊牌一起倾斜。", pt: 150, mh: 410,
          notes: [["适合", "下方有空位时最像吊牌；抽屉垂下去，和吊牌的线是一套语法。"], ["代价", "抽屉的一端会挡住下一行文字；下方不够时翻到上方。"], ["展开", "细线从复制下缘垂下，小签贴复制左缘，跟着吊牌一起倾斜 1.4°。"]],
          markup: () => `<span class="string" aria-hidden="true"></span><span class="hole" aria-hidden="true"></span>${act("translate")}${act("explain")}<div class="copy-wrap end">${copyAct()}${tray("tag")}</div>`,
          cls: "bar-tag" },
  fan:  { letter: "E", name: "扇面", idea: "复制那一片的外角再铆一把小扇，朝右侧展开，两片扇骨沿用大扇的线。", pt: 250, mh: 470,
          notes: [["适合", "三个动作等权；小扇只往右伸，不压住选区的上下两行。"], ["代价", "小扇伸到右侧 110 px；选区靠近舞台右缘时，落点要把它算进去，否则会被裁掉。"], ["展开", "从复制右片的外角（右下铆钉）展开，朝右侧伸出，不随上下翻转。"]],
          markup: () => `${blade("translate", "blade-l")}${blade("explain", "blade-c")}<div class="copy-wrap">${blade("copy", "blade-r").replace('class="blade blade-r"', 'class="blade blade-r" data-copy')}${tray("fan")}</div><svg class="fan-edge" viewBox="0 0 260 170" aria-hidden="true"><path d="M130 150 L10 87 L78 26 L182 26 L250 87 Z"/><path d="M130 150 L78 26 M130 150 L182 26"/></svg><span class="rivet" aria-hidden="true"></span><span class="handle" aria-hidden="true"></span>`,
          cls: "bar-fan" }
};

const main = document.getElementById("main");
main.innerHTML = Object.entries(FORMS).map(([key, f]) => `
  <section class="spec" id="v-${key}">
    <div class="meta">
      <div class="kicker"><span class="letter">${f.letter}</span><h2>${f.name}</h2></div>
      <p class="idea">${f.idea}</p>
      <dl class="notes">${f.notes.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    </div>
    <div class="stage" data-stage="${key}" style="--pt:${f.pt}px;--mh:${f.mh}px">
      <div class="reader"></div>
      <div class="bar ${f.cls}" data-bar="${key}">${f.markup()}</div>
      <span class="status" aria-live="polite"></span>
    </div>
  </section>`).join("");

const params = new URLSearchParams(location.search);
const askedLang = (params.get("lang") || "zh").toLowerCase();
const LANG = askedLang.startsWith("zh") ? "zh" : (L[askedLang] ? askedLang : "zh");
const THEMES = ["light", "dark", "frosted", "liquid"];
const THEME_LABEL = { light: "themeLight", dark: "themeDark", frosted: "themeFrosted", liquid: "themeLiquid" };
const root = document.documentElement;
const themeBtn = document.getElementById("tb");
let t = L[LANG];
let theme = THEMES.includes(params.get("theme")) ? params.get("theme") : "light";
let kind = KINDS.includes(params.get("kind")) ? params.get("kind") : "sentence";
let edgeTop = params.get("edge") === "top";

if (params.has("shot")) {
  document.querySelector(".controls").style.display = "none";
  document.querySelector(".ctl").style.display = "none";
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(v, hi));
}

/// Places the bar: the same rules as the app (classic flips above/below; tab beside; hand and fan centred; tag hangs below).
function placeBar(stage) {
  const bar = stage.querySelector("[data-bar]");
  const v = bar.dataset.bar;
  const sr = stage.getBoundingClientRect();
  const first = stage.querySelector(".sel").getClientRects()[0];
  const rect = { left: first.left - sr.left, top: first.top - sr.top, right: first.right - sr.left, bottom: first.bottom - sr.top, width: first.width };
  const lo = 10, hiX = stage.clientWidth - 10, hiY = stage.clientHeight - 10;
  const w = bar.offsetWidth, h = bar.offsetHeight;
  let left, top;

  if (v === "tab") {
    left = rect.right + 10;
    if (left + w > hiX) left = rect.left - w - 10;
    top = clamp(rect.top - 2, 8, Math.max(8, hiY - h));
  } else if (v === "hand" || v === "fan") {
    left = clamp(rect.left + rect.width / 2 - w / 2, lo, Math.max(lo, hiX - w));
    top = rect.top - h - 8;
    if (top < 8) top = rect.bottom + 8;
    top = clamp(top, 8, Math.max(8, hiY - h));
  } else if (v === "tag") {
    left = clamp(rect.left - 1, lo, Math.max(lo, hiX - w));
    top = rect.bottom + 16;
    if (top + h > hiY) top = rect.top - h - 16;
    top = clamp(top, 8, Math.max(8, hiY - h));
  } else {
    left = clamp(rect.left, lo, Math.max(lo, hiX - w));
    top = rect.top - h - 8;
    if (top < 8) top = rect.bottom + 8;
    top = clamp(top, 8, Math.max(8, hiY - h));
  }
  bar.style.left = `${Math.round(left)}px`;
  bar.style.top = `${Math.round(top)}px`;
  bar.classList.add("on");
}

/// Edge detection for the tray: it leaves the selection, and flips to the selection's side only when
/// the far side has no room inside the work area (the stage stands in for the work area here).
function placeTray(stage) {
  const bar = stage.querySelector("[data-bar]");
  const wrap = bar.querySelector(".copy-wrap");
  if (wrap.classList.contains("none") || bar.dataset.bar === "fan") return;
  const tray = wrap.querySelector(".tray");
  const sr = stage.getBoundingClientRect();
  const box = wrap.getBoundingClientRect();
  const first = stage.querySelector(".sel").getClientRects()[0];
  const selTop = first.top - sr.top;
  const top = box.top - sr.top, bottom = box.bottom - sr.top;
  const need = tray.offsetHeight + (bar.dataset.bar === "tag" ? 16 : 6);
  const H = stage.clientHeight;
  const isTab = bar.dataset.bar === "tab";
  let up = !isTab && bar.offsetTop < selTop;
  if (up && top - need < 8) up = false;
  if (!up && bottom + need > H - 8) up = true;
  wrap.classList.toggle("up", up);
  wrap.classList.toggle("down", !up);
}

function render() {
  document.querySelectorAll("[data-stage]").forEach((stage) => {
    const [before, selected, after] = SAMPLE[kind];
    stage.querySelector(".reader").innerHTML = `<p class="sample">${before}<span class="sel">${selected}</span>${after}</p>`;
    stage.classList.toggle("edge", edgeTop);
    const wrap = stage.querySelector(".copy-wrap");
    const tray = wrap.querySelector(".tray");
    let shown = 0;
    tray.querySelectorAll(".act").forEach((el) => {
      const on = el.dataset.kinds.split(" ").includes(kind);
      el.classList.toggle("off", !on);
      // The visible items are numbered in order: each form's CSS places the first and second by data-n.
      if (on) el.dataset.n = shown++; else delete el.dataset.n;
    });
    wrap.classList.toggle("none", shown === 0);
    tray.classList.toggle("solo", shown === 1);
    wrap.classList.remove("open");
  });
  document.querySelectorAll("[data-kind]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.kind === kind)));
  document.querySelectorAll("[data-edge]").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.edge === "top") === edgeTop)));
}

function layout() {
  document.querySelectorAll("[data-stage]").forEach((stage) => {
    placeBar(stage);
    placeTray(stage);
  });
}

function setLang(lang) {
  t = L[lang];
  root.lang = { en: "en", zh: "zh-CN", ja: "ja", es: "es" }[lang];
  document.querySelectorAll("[data-l]").forEach((el) => { el.textContent = t[el.dataset.l]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  themeBtn.textContent = t[THEME_LABEL[root.dataset.theme || "light"]];
  layout();
}

function applyTheme(v) {
  root.dataset.theme = v;
  theme = v;
  themeBtn.textContent = t[THEME_LABEL[v]];
  layout();
}

document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
themeBtn.addEventListener("click", () => applyTheme(THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]));
document.querySelectorAll("[data-kind]").forEach((b) => b.addEventListener("click", () => { kind = b.dataset.kind; render(); layout(); }));
document.querySelectorAll("[data-edge]").forEach((b) => b.addEventListener("click", () => { edgeTop = b.dataset.edge === "top"; render(); layout(); }));

/// Hover opens the tray after a short settle, and closes after a grace period so the pointer can cross the gap.
document.querySelectorAll(".copy-wrap").forEach((wrap) => {
  const targets = [wrap.querySelector("[data-copy]"), wrap.querySelector(".tray")];
  let timer;
  const open = () => { clearTimeout(timer); timer = setTimeout(() => wrap.classList.add("open"), 120); };
  const close = () => { clearTimeout(timer); timer = setTimeout(() => wrap.classList.remove("open"), 200); };
  targets.forEach((el) => { el.addEventListener("mouseenter", open); el.addEventListener("mouseleave", close); });
});

/// A press is simulated: it lights the stage's receipt and sends nothing.
document.querySelectorAll("[data-bar]").forEach((bar) => {
  bar.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const stage = bar.closest("[data-stage]");
    const status = stage.querySelector(".status");
    bar.querySelectorAll(".copy-wrap").forEach((w) => w.classList.remove("open"));
    status.innerHTML = `${CHECK}<span>${t[btn.dataset.action]}</span>`;
    status.classList.add("show");
    clearTimeout(stage._statusTimer);
    stage._statusTimer = setTimeout(() => status.classList.remove("show"), 1500);
  });
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layout, 120);
});

render();
// ?open holds every tray open, for screenshots: a still frame cannot hover, and the fade is switched off so the frame is final.
if (params.has("open")) {
  document.documentElement.classList.add("shot");
  document.querySelectorAll(".copy-wrap").forEach((w) => w.classList.add("open"));
}
setLang(LANG);
applyTheme(theme);
requestAnimationFrame(layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
</script>
</body>
</html>
