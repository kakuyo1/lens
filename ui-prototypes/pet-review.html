<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 宠物提问</title>
<!--
  桌面宠物的复习牌。宠物举牌（ask 动作）时，牌子由一只手握着杆子举起，手随身体上下起伏。
  默认左手；左侧的牌子和小卡放不下时换右手。指针停在牌上才展开「忘了 / 记得」；作答后牌收起，
  宠物做对应动作，缓存里的解释气泡在举牌的手那一侧出现，与宠物垂直居中。
  牌子、小卡和气泡都不被屏幕边缘截断：宠物不挪动；牌与小卡让开空间选侧，两侧都放不下时才夹进屏内（ADR 0053）。
  手是所选宠物 ask 的效果层（正式图）：ask.png 是右手，ask-left.png 是左手。
  用法见 README.md：?theme=dark|frosted|liquid、?bg=<当前玻璃主题的底图>、?lang=en|ja|es、?pet=dog|mochi|ghost、
  ?state=hover|forgot|remembered|timeout、?side=left|right（只强制作答气泡的一侧）、
  ?scale=1|2|3.01|4（牌子随宠物缩放）、?hand=left|right（强制举牌的手）、?f=0..3（停在某一帧）、?qa、?shot。
-->
<style>
@font-face{font-family:"Pixelify Sans";src:url("../data/fonts/PixelifySans-Regular.ttf") format("truetype");font-display:block}
:root{
  --bg:#e9ebef; --panel:#fff; --panel2:#f1f3f7; --line:#d6dae1; --line2:#e6e9ee;
  --text:#1a1a1f; --muted:#66666f; --faint:#9d9da8;
  --ok-bg:#e6f4ee; --ok-text:#1d7a52; --ink:#1a1a1f; --on:#fff;
  --bubble-bg:rgba(255,255,255,.86); --bubble-bd:rgba(255,255,255,.95);
  --bubble-sh:0 14px 44px -10px rgba(20,20,26,.26),inset 0 1px 0 #fff;
  --sign-paper:#f6efd9; --sign-ink:#26221b; --sign-shadow:5px 5px 0 rgba(20,20,26,.13);
  --r-lg:18px; --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
  --motion:180ms;
}
html[data-theme=dark]{
  --bg:#131316; --panel:#1c1c20; --panel2:#242429; --line:#2f2f37; --line2:#26262c;
  --text:#e9e9ee; --muted:#a3a3ae; --faint:#75757f;
  --ok-bg:#1a3527; --ok-text:#6fd6a5; --ink:#e9e9ee; --on:#16161a;
  --bubble-bg:rgba(30,30,35,.82); --bubble-bd:rgba(255,255,255,.09);
  --bubble-sh:0 16px 48px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
}
html[data-theme=frosted],html[data-theme=liquid]{
  --bg:transparent; background-image:var(--wall); background-size:cover; background-attachment:fixed;
}
html[data-theme=frosted]{
  --wall:url("frosted-backdrops/night-lines.png");
  --panel:rgba(255,255,255,.40); --panel2:rgba(18,24,36,.065);
  --line:rgba(18,24,36,.15); --line2:rgba(18,24,36,.10);
  --text:#14161c; --muted:#3c4250; --faint:#535865;
  --ink:#191b21; --on:#fff;
  --sh2:0 4px 14px rgb(255 255 255/5.5%);
}
html[data-theme=liquid]{
  --wall:url("liquid-backdrops/cool-wall.png");
  --panel:rgba(248,250,254,.78); --panel2:rgba(18,24,36,.075);
  --line:rgba(18,24,36,.16); --line2:rgba(18,24,36,.11);
  --text:#101319; --muted:#333846; --faint:#4a4f5e;
  --ink:#12151b; --on:#fff; --r-lg:22px;
  --sh2:0 1px 2px rgba(10,14,24,.14),0 22px 54px -20px rgba(10,14,24,.48);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--f); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.desk{position:relative;height:100vh;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:560px;height:560px;transform:translate(-50%,-50%)}

/* 宠物画布 88 × 88，每个画布单位 --u 个 CSS 像素（由 ?scale 决定）。手与牌子都在同一个画布坐标里。 */
.figure{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);--u:3.01px}
.layer{position:absolute;left:0;top:0;width:100%;height:100%;background-repeat:no-repeat;image-rendering:pixelated}
.face{background-repeat:no-repeat}
.fx{display:none}


/* 举牌：牌子先按 3.01 倍的尺寸画，再整体乘以 K = scale / 3.01；小卡不缩放（保持点击区）。 */
.hold{position:static}
.sign-wrap{position:absolute;transform-origin:0 0;z-index:2}
.sign-core{position:relative;width:max-content}
.sign{
  background:var(--sign-paper);color:var(--sign-ink);
  border:3px solid var(--sign-ink);border-radius:2px;box-shadow:var(--sign-shadow);
  padding:14px 18px 12px;white-space:nowrap;
  font-family:"Pixelify Sans",monospace;font-size:20px;line-height:1;letter-spacing:0;
}
.pole{position:absolute;top:100%;left:14px;width:4px;height:26px;background:var(--sign-ink)}
.hold[data-side=left] .pole{left:auto;right:14px}
.hold[hidden]{display:none}
.ask-pop{
  position:absolute;display:flex;gap:8px;padding:8px;z-index:3;width:max-content;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--bubble-sh);
  max-width:0;opacity:0;overflow:hidden;pointer-events:none;
  transition:max-width var(--motion) ease,opacity var(--motion) ease;
}
.hold.open .ask-pop{max-width:210px;opacity:1;pointer-events:auto}
.hold.open .ask-pop.instant{transition:none}
html[data-theme=frosted] .ask-pop{background:var(--panel);box-shadow:var(--sh2);border-color:rgba(255,255,255,.2);backdrop-filter:blur(6px) saturate(120%)}
html[data-theme=liquid] .ask-pop{background:var(--panel);box-shadow:var(--sh2);border-color:rgba(255,255,255,.1);backdrop-filter:blur(6px) contrast(1.05)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:0 14px;height:34px;border-radius:999px;white-space:nowrap;
  font-family:var(--f);font-size:12px;font-weight:700;line-height:1;
  border:1px solid transparent;cursor:pointer;transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.97)}
.btn.secondary{background:var(--panel2);color:var(--text);border-color:var(--line)}
.btn.primary{background:var(--ink);color:var(--on)}
.btn:hover{filter:brightness(1.03)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* 作答后的气泡：与解释气泡同一张卡，但不出学习判定按钮。位置是视口坐标，由 placeBubble 夹在屏幕内。 */
.bubble-wrap{position:fixed;z-index:4}
.bubble-wrap[hidden]{display:none}
.bubble{
  width:270px;background:var(--bubble-bg);border:1px solid var(--bubble-bd);
  border-radius:var(--r-lg);box-shadow:var(--bubble-sh);padding:12px 16px 11px;
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
}
.bub-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tag{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok-text);font-weight:700}
.bub-close{margin-left:auto;width:15px;height:15px;border:0;background:none;color:var(--faint);cursor:pointer;padding:0;line-height:0}
.bub-close:hover{color:var(--text)}
.bub-word{font-size:20px;font-weight:700;letter-spacing:-.01em}
.ipa{margin-left:7px;font-size:12.5px;font-weight:400;color:var(--faint)}
.bub-def{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:6px}
.bub-meta{font-size:11px;color:var(--faint);margin-top:9px;display:flex;align-items:center;gap:5px}
.bub-meta svg{width:12px;height:12px}
html[data-theme=frosted] .bubble{background:var(--panel);box-shadow:var(--sh2);border-color:rgba(255,255,255,.2);backdrop-filter:blur(6px) saturate(120%)}
html[data-theme=liquid] .bubble{background:var(--panel);box-shadow:var(--sh2);border-color:rgba(255,255,255,.1);backdrop-filter:blur(6px) contrast(1.05)}

/* 原型自己的控件，不是表面的一部分。 */
.controls{position:fixed;left:16px;top:14px;display:flex;gap:6px;z-index:10;flex-wrap:wrap;max-width:60vw}
.controls[hidden]{display:none}
.controls button,.themebtn{
  padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-family:var(--f);font-size:11.5px;cursor:pointer;
}
.controls button:hover,.themebtn:hover{color:var(--text)}
.themebtn{position:fixed;right:16px;top:14px;z-index:10}
.qa{position:fixed;left:0;bottom:0;font:10px monospace;max-width:100vw;white-space:pre-wrap;z-index:10}
@media (max-width:700px){
  .stage{transform:translate(-50%,-50%) scale(.72)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="desk">
  <div class="stage">
    <div class="figure" id="figure">
      <div class="layer body" id="body"></div>
      <div class="layer face" id="face"></div>
      <div class="layer fx" id="fx"></div>
      <div class="hold" id="hold">
        <div class="sign-wrap" id="signWrap">
          <div class="sign-core">
            <div class="sign" id="sign">ephemeral</div>
            <div class="pole" aria-hidden="true"></div>
          </div>
        </div>
        <div class="ask-pop" id="askPop" role="group">
          <button class="btn secondary" id="forgot" data-l="forgot"></button>
          <button class="btn primary" id="remembered" data-l="remembered"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="bubble-wrap" id="bubbleWrap" hidden>
    <div class="bubble" id="bubble">
      <div class="bub-top">
        <span class="tag" data-l="new"></span>
        <button class="bub-close" id="close" aria-label="Close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="bub-word">ephemeral<span class="ipa">/ɪˈfemərəl/</span></div>
      <div class="bub-def">Lasting for a very short time.</div>
      <div class="bub-meta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>
        <span id="meta">5 s</span>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button id="askBtn">提问</button>
    <button id="forgotBtn">忘了</button>
    <button id="rememberedBtn">记得</button>
    <button id="timeoutBtn">超时</button>
    <button id="scaleBtn"></button>
    <button id="handBtn"></button>
  </div>
  <button class="themebtn" id="tb"></button>
  <pre class="qa" id="qa" hidden></pre>
</div>

<script>
/// 表面上的两枚按钮与牌子的标签只有这几条；牌上的单词与气泡里的释义是样例内容，
/// 不走界面语言（释义跟随“解释语言”设置，这里取默认的英文）。
const L = {
  zh: {forgot:'忘了', remembered:'记得', new:'新词', meta:'5 s'},
  en: {forgot:'Forgot', remembered:'Remembered', new:'New', meta:'5 s'},
  ja: {forgot:'忘れた', remembered:'覚えてる', new:'初見', meta:'5 s'},
  es: {forgot:'Olvidé', remembered:'Recordé', new:'Nueva', meta:'5 s'},
};
const params = new URLSearchParams(location.search);
const PET = ['dog', 'mochi', 'ghost'].includes(params.get('pet')) ? params.get('pet') : 'dog';
const PET_DIR = `../data/pet/${PET}`;
const lang = L[params.get('lang')] ? params.get('lang') : 'zh';
const l = L[lang];
document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
for (const el of document.querySelectorAll('[data-l]')) {
  el.textContent = l[el.dataset.l];
}
document.getElementById('meta').textContent = l.meta;

// ---- 宠物与举牌的几何（画布单位，随 ?pet= 读取）----
const CANVAS = 88, HAND = 9;
/// 杆子：离牌子内侧 14 px、宽 4 px（中心距内侧 16 px）、长 26 px，均为 3.01 倍时的设计尺寸。
const POLE_LEN = 26, POLE_CENTRE = 16;
/// ask 动作的身体锚点；狗与 mochi 相同，ghost 的拳头整体低 12 行。
const ASK = [{dx:3,dy:0}, {dx:3,dy:-3}, {dx:3,dy:-6}, {dx:3,dy:-3}];
/// 手在 ask 效果层里的拳头列（已含身体锚点的 dx）：右手从第 79 列起，左手从第 30 列起。
/// 两张效果图 ask.png（右）与 ask-left.png（左）都装在所选宠物的 sprites/effects 里，拳头左右对称。
const FIST = {right: 79, left: 30}, FIST_TOP = PET === 'ghost' ? 60 : 48;
/// 小卡展开后的宽度（.hold.open .ask-pop 的 max-width），以及它与牌子的间距。
const CARD_W = 210, CARD_GAP = 10;
/// 屏幕边缘留的空白；身体上下起伏时手会高出 6 个画布单位。
const PAD = 16, BOB = 6;
const BUBBLE_GAP = 10;
const SHEET = {
  idle:      {file:'idle.png',      frames:5, fps:5,  loop:true,  face:0},
  ask:       {file:'ask.png',       frames:4, fps:4,  loop:true,  face:0, fx:'ask.png'},
  encourage: {file:'encourage.png', frames:5, fps:8,  loop:false, face:5, fx:'encourage.png'},
  celebrate: {file:'celebrate.png', frames:8, fps:10, loop:false, face:5, fx: PET === 'dog' ? 'fireworks.png' : 'celebrate.png'},
  angry:     {file:'angry.png',     frames:5, fps:10, loop:false, face:9, fx:'angry.png'},
};
const SIZES = [1, 2, 3.01, 4];
const DEFAULT_SCALE = 3.01;
let S = SIZES.includes(Number(params.get('scale'))) ? Number(params.get('scale')) : DEFAULT_SCALE;
let hand = ['left', 'right'].includes(params.get('hand')) ? params.get('hand') : 'auto';
const FREEZE = params.has('f') ? Number(params.get('f')) : null;
const sideOverride = params.get('side');

const figure = document.getElementById('figure');
const body = document.getElementById('body');
const face = document.getElementById('face');
const fx = document.getElementById('fx');
const hold = document.getElementById('hold');
const signWrap = document.getElementById('signWrap');
const signEl = document.getElementById('sign');
const askPop = document.getElementById('askPop');
const bubbleWrap = document.getElementById('bubbleWrap');
const bubble = document.getElementById('bubble');
const meta = document.getElementById('meta');

let act = 'idle', frame = 0, acc = 0, lastT = 0, asking = false, countdown = 0, remaining = 5;
/// The sign's offset from its hanging place, in layout px: zero unless neither side fits (see fitSign).
let nudge = {x: 0, y: 0};
/// The paw's side and the card's side, as relayout() chose them. The card opens on `card`; `side` is the paw's hand.
let side = 'left', card = 'right';

/// 当前缩放下的像素：一个画布单位 S 个 CSS 像素；牌子整体乘 K，相对 3.01 倍。
const K = () => S / DEFAULT_SCALE;

function setAct(name) {
  act = name; frame = 0; acc = 0;
  const def = SHEET[name];
  body.style.backgroundImage = `url("${PET_DIR}/sprites/body/${def.file}")`;
  face.style.backgroundImage = `url("${PET_DIR}/sprites/expressions/eyes.png")`;
  fx.style.display = def.fx ? 'block' : 'none';
  fx.style.backgroundRepeat = 'no-repeat';
}

/// The sign, its pole and its card for paw side `s` and card side `c`, in layout px from the figure's top-left. `dy` is
/// the body's bob: it moves the paw, the pole and the sign with it.
function geometry(s, c, dy, n = nudge) {
  const k = K();
  const vw = signEl.offsetWidth * k, vh = signEl.offsetHeight * k;
  const gripX = (FIST[s] + HAND / 2) * S;
  const gripY = (FIST_TOP + dy + HAND / 3) * S;
  const left = s === 'right' ? gripX - POLE_CENTRE * k : gripX - vw + POLE_CENTRE * k;
  const top = gripY - (signEl.offsetHeight + POLE_LEN) * k;
  const cardTop = top + vh / 2 - askPop.offsetHeight / 2;
  const cardLeft = c === 'right' ? left + vw + CARD_GAP : left - CARD_GAP - CARD_W;
  return {left: left + n.x, top: top + n.y, vw, gripY: gripY + n.y, cardLeft: cardLeft + n.x, cardTop: cardTop + n.y, cardH: askPop.offsetHeight};
}

/// Puts the sign, the pole and the card where the paw is, for the chosen sides, at this frame's bob.
function placeHold(dy) {
  const g = geometry(side, card, dy);
  signWrap.style.left = g.left + 'px';
  signWrap.style.top = g.top + 'px';
  signWrap.style.transform = `scale(${K()})`;
  askPop.style.top = g.cardTop + 'px';
  if (card === 'right') {
    askPop.style.left = g.cardLeft + 'px';
    askPop.style.right = 'auto';
  } else {
    askPop.style.left = 'auto';
    askPop.style.right = (CANVAS * S - (g.cardLeft + CARD_W)) + 'px';
  }
  hold.dataset.side = side;
  hold.dataset.card = card;
}

/// The sign with its pole, and the open card, and the figure, as screen boxes [left, top, right, bottom] for paw side
/// `s` and card side `c`. The boxes include the bob's reach upwards, so a frame never leaves the screen.
function boxes(s, c) {
  const fr = figure.getBoundingClientRect();
  const F = fr.width / (CANVAS * S);
  const g = geometry(s, c, 0);
  const box = (x0, y0, x1, y1) => [fr.left + x0 * F, fr.top + y0 * F, fr.left + x1 * F, fr.top + y1 * F];
  return {
    figure: [fr.left, fr.top, fr.right, fr.bottom],
    sign: box(g.left, g.top - BOB * S, g.left + g.vw, g.gripY),
    card: box(g.cardLeft, g.cardTop - BOB * S, g.cardLeft + CARD_W, g.cardTop + g.cardH),
  };
}

/// Screen px a box reaches outside the margin on each edge, summed.
function overflow([l, t, r, b]) {
  return Math.max(0, PAD - l) + Math.max(0, r - (innerWidth - PAD)) + Math.max(0, PAD - t) + Math.max(0, b - (innerHeight - PAD));
}

/// The paw side and the card side. Left is the default: a side is taken when its sign and its card fit, the card on the
/// outside first, then on the inside. When no side fits, the one that overflows least is taken.
function chooseHand() {
  const order = hand === 'auto' ? ['left', 'right'] : [hand];
  const other = s => (s === 'left' ? 'right' : 'left');
  let best = null;
  for (const s of order) {
    for (const c of [s, other(s)]) {
      const b = boxes(s, c);
      const over = overflow(b.sign) + overflow(b.card);
      if (over === 0) return {side: s, card: c};
      if (!best || over < best.over) best = {side: s, card: c, over};
    }
  }
  return best;
}

/// Only when neither side has room for the sign and its card: moves the sign and the card inside the screen, in layout px.
/// The pet never moves (ADR 0053), so the sign may then come off the hand; that happens only on a screen narrower than the
/// pet and the sign together. Where the pair is wider or taller than the screen, the start edge is kept.
function fitSign(s, c) {
  const fr = figure.getBoundingClientRect();
  const F = fr.width / (CANVAS * S);
  const b = boxes(s, c);
  const lo = i => Math.min(b.sign[i], b.card[i]);
  const hi = i => Math.max(b.sign[i + 2], b.card[i + 2]);
  const fit = (from, to, room) => {
    if (to - from > room - 2 * PAD || from < PAD) return PAD - from;
    if (to > room - PAD) return room - PAD - to;
    return 0;
  };
  return {x: fit(lo(0), hi(0), innerWidth) / F, y: fit(lo(1), hi(1), innerHeight) / F};
}

/// The answer's bubble: on the hand's side, centred on the pet, and kept whole on the screen. It goes to the other side only
/// when the hand's side has no room and the other side has; when neither has, it stays on the hand's side and covers the
/// pet's edge, but never the screen's. ?side=left|right forces the side, for comparison.
function placeBubble() {
  const want = sideOverride === 'left' || sideOverride === 'right' ? sideOverride : side;
  const fr = figure.getBoundingClientRect();
  const bw = bubbleWrap.offsetWidth, bh = bubbleWrap.offsetHeight;
  const room = {right: innerWidth - PAD - (fr.right + BUBBLE_GAP), left: fr.left - BUBBLE_GAP - PAD};
  const other = want === 'right' ? 'left' : 'right';
  const s = room[want] >= bw ? want : room[other] >= bw ? other : want;
  let x = s === 'right' ? fr.right + BUBBLE_GAP : fr.left - BUBBLE_GAP - bw;
  x = Math.max(PAD, Math.min(x, innerWidth - PAD - bw));
  let y = (fr.top + fr.bottom) / 2 - bh / 2;
  y = Math.max(PAD, Math.min(y, innerHeight - PAD - bh));
  bubbleWrap.style.left = x + 'px';
  bubbleWrap.style.top = y + 'px';
}

/// Chooses the sides, and moves the sign only when neither side has room (see fitSign). Runs when a question
/// starts and when the window, the pet's size, or the hand choice changes; the frames only move the paw and the sign.
function relayout() {
  nudge = {x: 0, y: 0};
  if (asking && act === 'ask') {
    hold.hidden = false;
    ({side, card} = chooseHand());
    nudge = fitSign(side, card);
    placeHold(ASK[0].dy);
  }
  placeBubble();
  report();
}

function render() {
  const def = SHEET[act];
  const a = act === 'ask' ? ASK[frame] : {dx:0, dy:0};
  body.style.backgroundSize = def.frames * CANVAS * S + 'px ' + CANVAS * S + 'px';
  body.style.backgroundPosition = `${-frame * CANVAS * S}px 0`;
  body.style.transform = `translate(${a.dx * S}px, ${a.dy * S}px)`;
  face.style.backgroundSize = `${10 * CANVAS * S}px ${CANVAS * S}px`;
  face.style.backgroundPosition = `${-def.face * CANVAS * S}px 0`;
  face.style.transform = body.style.transform;
  const showSign = act === 'ask' && asking;
  hold.hidden = !showSign;
  if (showSign) placeHold(a.dy);
  if (def.fx) {
    // The left paw has its own sheet (effectLeft in animations.json); the right paw's sheet is the default.
    const sheet = act === 'ask' && side === 'left' ? 'ask-left.png' : def.fx;
    if (fx.dataset.sheet !== sheet) {
      fx.style.backgroundImage = `url("${PET_DIR}/sprites/effects/${sheet}")`;
      fx.dataset.sheet = sheet;
    }
    fx.style.backgroundSize = `${def.frames * CANVAS * S}px ${CANVAS * S}px`;
    fx.style.backgroundPosition = `${-frame * CANVAS * S}px 0`;
  }
}

function tick(t) {
  const dt = lastT ? Math.min(t - lastT, 100) : 0;
  lastT = t;
  if (FREEZE !== null) {
    frame = FREEZE % SHEET[act].frames;
  } else {
    acc += dt;
    const def = SHEET[act];
    const step = 1000 / def.fps;
    while (acc >= step) {
      acc -= step;
      frame += 1;
      if (frame >= def.frames) {
        if (def.loop) { frame = 0; }
        else { setAct('idle'); break; }
      }
    }
  }
  render();
  requestAnimationFrame(tick);
}

window.addEventListener('resize', relayout);
document.fonts.ready.then(relayout);

// 悬浮在牌子或小卡上都算“在牌上”；离开两者才收起。
for (const el of [signWrap, askPop]) {
  el.addEventListener('pointerenter', () => hold.classList.add('open'));
  el.addEventListener('pointerleave', e => {
    if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.hold')) hold.classList.remove('open');
  });
}

function ask() {
  clearInterval(countdown);
  bubbleWrap.hidden = true;
  asking = true;
  setAct('ask');
  relayout();
}

function showBubble() {
  bubbleWrap.hidden = false;
  placeBubble();
  remaining = 5;
  meta.textContent = remaining + ' s';
  clearInterval(countdown);
  countdown = setInterval(() => {
    if (bubble.matches(':hover')) return;
    remaining -= 1;
    meta.textContent = Math.max(remaining, 0) + ' s';
    if (remaining <= 0) hideBubble();
  }, 1000);
}

function hideBubble() {
  clearInterval(countdown);
  bubbleWrap.hidden = true;
}

function answer(kind) {
  asking = false;
  hold.classList.remove('open');
  setAct(kind === 'forgot' ? 'encourage' : 'celebrate');
  showBubble();
  relayout();
}

function timeout() {
  asking = false;
  hold.classList.remove('open');
  hideBubble();
  setAct('angry');
  relayout();
}

document.getElementById('forgot').addEventListener('click', () => answer('forgot'));
document.getElementById('remembered').addEventListener('click', () => answer('remembered'));
document.getElementById('close').addEventListener('click', hideBubble);
document.getElementById('askBtn').addEventListener('click', ask);
document.getElementById('forgotBtn').addEventListener('click', () => answer('forgot'));
document.getElementById('rememberedBtn').addEventListener('click', () => answer('remembered'));
document.getElementById('timeoutBtn').addEventListener('click', timeout);

// 原型控件：宠物尺寸循环 ×1 / ×2 / ×3.01 / ×4，举牌的手循环 自动 / 右手 / 左手。
const scaleBtn = document.getElementById('scaleBtn');
const handBtn = document.getElementById('handBtn');
const HAND_LABEL = {auto: '手：自动', right: '手：右', left: '手：左'};
const HAND_NEXT = {auto: 'right', right: 'left', left: 'auto'};
function applySize() {
  figure.style.width = figure.style.height = CANVAS * S + 'px';
  figure.style.setProperty('--u', S + 'px');
  scaleBtn.textContent = '尺寸 ×' + (S === DEFAULT_SCALE ? '3.01' : S);
  render();
  relayout();
}
scaleBtn.addEventListener('click', () => {
  S = SIZES[(SIZES.indexOf(S) + 1) % SIZES.length];
  applySize();
});
handBtn.textContent = HAND_LABEL[hand];
handBtn.addEventListener('click', () => {
  hand = HAND_NEXT[hand];
  handBtn.textContent = HAND_LABEL[hand];
  relayout();
});

// 主题按钮，和其他原型一致：四套主题循环。
const THEMES = [
  ['light', '晴朗白昼'],
  ['dark', '静谧暗夜'],
  ['frosted', '雾面玻璃'],
  ['liquid', '流光玻璃'],
];
const tb = document.getElementById('tb');
let theme = params.get('theme');
if (!THEMES.some(([id]) => id === theme)) theme = 'light';
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  tb.textContent = THEMES.find(([id]) => id === theme)[1];
}
applyTheme();
/// ?bg=<name> swaps in one of the current glass theme's test backdrops, as the other surfaces do.
const WALLS = {
  frosted: ['night-lines', 'text-dense', 'color-blocks', 'sky-light', 'checker'],
  liquid: ['cool-wall', 'web-light', 'web-dark', 'colorful', 'stripes', 'black', 'white'],
};
const wallName = params.get('bg');
if (wallName === 'paper') {
  document.documentElement.style.background = '#f6f2ea';
  document.documentElement.style.backgroundImage = 'none';
} else if ((WALLS[document.documentElement.dataset.theme] || []).includes(wallName))
  document.documentElement.style.setProperty('--wall', `url("${document.documentElement.dataset.theme}-backdrops/${wallName}.png")`);
tb.addEventListener('click', () => {
  const i = THEMES.findIndex(([id]) => id === theme);
  theme = THEMES[(i + 1) % THEMES.length][0];
  applyTheme();
});

if (params.has('shot')) {
  document.getElementById('controls').hidden = true;
  tb.hidden = true;
}

/// ?qa: the boxes the page drew, in screen px, for the layout checks. Nothing else reads it.
function report() {
  const out = document.getElementById('qa');
  if (!params.has('qa')) return;
  out.hidden = false;
  const rect = el => { const r = el.getBoundingClientRect(); return [r.left, r.top, r.right, r.bottom].map(v => Math.round(v * 10) / 10); };
  out.textContent = JSON.stringify({
    viewport: [innerWidth, innerHeight],
    chosen: {side, card},
    figure: rect(figure),
    sign: hold.hidden ? null : rect(signWrap),
    pole: hold.hidden ? null : rect(document.querySelector('.pole')),
    card: hold.hidden || !hold.classList.contains('open') ? null : rect(askPop),
    bubble: bubbleWrap.hidden ? null : rect(bubbleWrap),
  });
}

// 截图状态：默认停在“举牌”（ask 动作），其余三个直接跳到对应的一帧。
applySize();
setAct('ask');
asking = true;
relayout();
requestAnimationFrame(tick);
const state = params.get('state');
if (state === 'hover') {
  hold.classList.add('open');
  askPop.classList.add('instant');
  relayout();
} else if (state === 'forgot') {
  answer('forgot');
} else if (state === 'remembered') {
  answer('remembered');
} else if (state === 'timeout') {
  timeout();
}
</script>
</body>
