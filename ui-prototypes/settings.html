<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 设置</title>
<style>
:root{
  --bg:#e9ebef; --panel:#fff; --panel2:#f1f3f7; --line:#d6dae1; --line2:#e6e9ee;
  --text:#1a1a1f; --muted:#66666f; --faint:#9d9da8;
  --ink:#1a1a1f; --on:#fff;
  --r-lg:18px; --sw-off:var(--line);
  --sh2:0 2px 6px rgba(20,20,26,.06),0 24px 60px -24px rgba(20,20,26,.24);
  --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
}
html[data-theme=dark]{
  --bg:#131316; --panel:#1c1c20; --panel2:#242429; --line:#2f2f37; --line2:#26262c;
  --text:#e9e9ee; --muted:#a3a3ae; --faint:#75757f;
  --ink:#e9e9ee; --on:#16161a;
  --sh2:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
}
/* 两套玻璃主题。面板半透明，正文可读性取决于读者的桌面（磨砂的底色 40% 不再保证对比度，见 UI.md 3.1c）。
   --wall 是桌面壁纸的替身，只用来让玻璃有东西可透；真实环境里这一层是读者自己的壁纸。两套主题各带一份，
   因为两块玻璃要证明的东西不同：磨砂要的是模糊吃掉细节，液体要的是折射与透，一张底图服务不了两边。 */
html[data-theme=frosted],html[data-theme=liquid]{
  --bg:transparent;
  background-image:var(--wall); background-attachment:fixed; background-size:cover;
}
/* 磨砂玻璃 = Zen-Nebula（JustAdumbPrsn/Zen-Nebula）的玻璃：白色 40% 底 + blur(32px) saturate(140%) + 25% 白描边 + 柔和阴影，
   参数取自其 config.css 与 general-ui.css，原值为 blur 32px、saturate 140%、描边 25%。设置里的默认值已调为 10% / 120% / 20%，这里的回退值与之同步。没有噪点。底色 40% 固定、不设旋钮。
   底图在 frosted-backdrops/ 下，默认夜色细纹：冷调、低饱和，细网给足高频细节，模糊一开细网就化掉，靠它看得出模糊吃掉了什么。 */
html[data-theme=frosted]{
  --panel:rgba(255,255,255,.40); --panel2:rgba(18,24,36,.065);
  --line:rgba(18,24,36,.15); --line2:rgba(18,24,36,.10);
  --text:#14161c; --muted:#3c4250; --faint:#535865;
  --ink:#191b21; --on:#fff; --sw-off:rgba(18,24,36,.22);
  --sh2:0 4px 14px rgb(255 255 255/5.5%);
}
/* 液体玻璃 = 苹果 2025 液态玻璃的 CSS 近似：卡片本体不铺底色、对比更高（材质更稠）、圆角更大。
   折射由下方 SVG 位移滤镜完成（Chromium 系，做法同 shuding/liquid-glass）；随背后内容自适应靠系统采样，网页做不到，此处不装。
   底图是低饱和的冷灰：一块暖白光斑、一块暗色团，外加一层细斜线。光斑与暗团的边太软，位移读不出来；细线给折射提供能弯的边，颜色不抢注意力。
   它不用来证明饱和度，饱和度的效果要换一张有色的底图才看得出来。 */
html[data-theme=liquid]{
  --panel:rgba(248,250,254,.78); --panel2:rgba(18,24,36,.075);
  --line:rgba(18,24,36,.16); --line2:rgba(18,24,36,.11);
  --text:#101319; --muted:#333846; --faint:#4a4f5e;
  --ink:#12151b; --on:#fff; --sw-off:rgba(18,24,36,.24);
  --r-lg:22px;
  --sh2:0 1px 2px rgba(10,14,24,.14),0 22px 54px -20px rgba(10,14,24,.48);
  --wall:url("liquid-backdrops/cool-wall.png");
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);color:var(--text);background:var(--bg);min-height:100vh;display:grid;place-items:center;padding:36px 20px;font-size:13px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* 面板固定高度：首屏只列分类，设置再多也在内部滚动，不再把浮层撑高 */
.settings{width:380px;height:480px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh2);display:flex;flex-direction:column;overflow:hidden;transform:translate(var(--drag-x,0),var(--drag-y,0))}
body.dragging{user-select:none;cursor:default}
/* 玻璃面板。面板自身有 backdrop-filter，内部控件不再各加一层——它们只是叠在这层已模糊的底上的半透明填充。 */
html[data-theme=frosted] .settings{backdrop-filter:blur(var(--glass-blur,6px)) saturate(var(--glass-sat,120%));border-color:rgba(255,255,255,var(--glass-rim,.2))}
/* 下拉列表是弹出层：底下透明的 40% 面板会让参数透出来，所以单独铺 78% 白，与液体玻璃的弹出层同一口径（UI.md 3.1c） */
html[data-theme=frosted] .dd-list{background:rgba(255,255,255,.78)}
/* 液体玻璃整张卡透明，不铺底色：背后像素由 SVG 位移滤镜弯折（边缘弯，中心也有折射），高光与描边是材质信号。
   正文用深字，适合浅色底图；深色底图上对比度不足，见 UI.md 3.1d。 */
html[data-theme=liquid] .settings{background:transparent;border-color:rgba(255,255,255,var(--glass-rim,.1));
  backdrop-filter:blur(var(--glass-blur,6px)) contrast(1.05);
  box-shadow:var(--sh2)}
/* 折射：浏览器支持 url() 形式的 backdrop-filter 时（applyTheme 里探测，Chromium 系支持），位移滤镜只做折射这一步，
   之后接普通的模糊与饱和（同 shuding/liquid-glass 的写法）。 */
html[data-theme=liquid][data-refract] .settings{backdrop-filter:blur(var(--glass-blur,6px)) url(#lg-liquid)}
/* 关掉透明时退成实底卡片，与系统一致的降级方式；底图留着，卡片仍落在壁纸上而不是白页上。
   描边一并交还给 --line：实底上白边不再是玻璃边缘，只是画错的一笔。 */
@media (prefers-reduced-transparency:reduce){
  html[data-theme=frosted],html[data-theme=liquid]{--panel:#fafbfd;--panel2:#f0f3f8;--line:#dde2ea;--line2:#e9edf3;--sw-off:#d6dae1}
  html[data-theme=frosted] .settings,html[data-theme=liquid] .settings,html[data-theme=liquid][data-refract] .settings{backdrop-filter:none;background-image:none;border-color:var(--line)}
  html[data-theme=frosted] .dd-list{background:var(--panel)}
  html[data-theme=liquid] .settings{background:var(--panel)}
}
.set-h{display:flex;align-items:center;gap:9px;padding:0 20px;min-height:58px;border-bottom:1px solid var(--line2);flex:none}
.set-back{display:none;place-items:center;width:26px;height:26px;margin-left:-6px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.set-back:hover{background:var(--panel2);color:var(--text)}
.settings[data-level=sub] .set-back{display:grid}
.set-title{font-size:14px;font-weight:700}
.set-sep{color:var(--faint);font-size:12px}
.set-crumb{font-size:12px;color:var(--muted);font-weight:400}
.set-h .close{margin-left:auto;width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--faint);font-size:18px;line-height:1}
.set-h .close:hover{background:var(--panel2);color:var(--text)}
.set-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 20px 18px}
/* 滚动条：6 px 一条，滑块取 --faint，与 pet.html 同一份写法。标准属性只能关进 Gecko，Chromium 一读到
   scrollbar-color 就切回原生滚动条、上下箭头跟着长出来，所以这里只留 ::-webkit- 组加一行 @supports。 */
.set-body::-webkit-scrollbar,.dd-list::-webkit-scrollbar{width:6px;height:6px}
.set-body::-webkit-scrollbar-track,.dd-list::-webkit-scrollbar-track{background:transparent}
.set-body::-webkit-scrollbar-thumb,.dd-list::-webkit-scrollbar-thumb{background:var(--faint);border-radius:999px}
.set-body::-webkit-scrollbar-thumb:hover,.dd-list::-webkit-scrollbar-thumb:hover{background:var(--muted)}
@supports (-moz-appearance:none){.set-body,.dd-list{scrollbar-width:thin;scrollbar-color:var(--faint) transparent}}

/* 分类目录：一行一类，新增设置落在分类内部 */
.catalog{display:flex;flex-direction:column;gap:2px}
.cat{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:11px 9px;border:0;border-radius:9px;background:transparent;text-align:left}
.cat:hover{background:var(--panel2)}
.cat-t{display:block;font-size:13px}
.cat-s{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.cat .chev{margin-left:auto;color:var(--faint);font-size:20px;line-height:1}

/* 分类设置与子页面 */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.flabel{display:block;margin-bottom:7px;font-size:12px;color:var(--muted)}
.fhelp{margin-top:6px;font-size:11px;color:var(--muted)}
.pf{display:flex;align-items:center;gap:8px;height:35px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer}
.pf span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text)}
.pf span.ph{color:var(--faint)}
.pf svg{width:15px;height:15px;flex:none;margin-left:auto;color:var(--faint)}
.input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-family:var(--f);font-size:12px}
.input::placeholder{color:var(--faint)}
.money{position:relative}
.money span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.money .input{padding-left:26px}
.unit{position:relative}
.unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.unit .input{padding-right:26px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;text-align:center;padding:6.5px 0;border:0;background:transparent;font-size:12px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on);font-weight:600}
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:8px;width:100%;height:35px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-family:var(--f);font-size:13px;text-align:left}
.dd-btn svg{margin-left:auto;width:14px;height:14px;color:var(--faint);flex:none}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:9;display:none;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh2);padding:5px;max-height:252px;overflow-y:auto}
.dd.open .dd-list{display:block}
.dd-item{display:flex;align-items:center;width:100%;height:29px;padding:0 11px;border:0;border-radius:8px;background:transparent;font-size:13px;color:var(--text);text-align:left}
.dd-item:hover{background:var(--panel2)}
.dd-item[aria-selected=true]{background:var(--ink);color:var(--on);font-weight:600}
.dd-note{margin-left:auto;font-size:11px;color:var(--faint)}
.dd-item[aria-selected=true] .dd-note{color:rgba(255,255,255,.62)}
html[data-theme=dark] .dd-item[aria-selected=true] .dd-note{color:rgba(0,0,0,.5)}
.dd-sep{height:1px;background:var(--line2);margin:5px 8px}
.mf{position:relative}
.mf-in{width:100%;height:35px;padding:0 38px 0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-family:var(--f);font-size:13px}
.mf-in:focus{outline:none;border-color:var(--ink)}
.mf-go{position:absolute;right:3px;top:3px;width:30px;height:29px;display:flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--faint)}
.mf-go:hover{color:var(--text)}
.mf-go svg{width:14px;height:14px}
/* 滑动条用原生 range + accent-color，形状归 Chromium；对照稿要读的是档位与数值，不是它的像素。
   轨道、滑块的画法留给 QML 侧，此处不抠。 */
.slrow{display:flex;align-items:baseline;margin-bottom:7px}
.slrow .flabel{margin-bottom:0}
.slrow.off{opacity:.45}
.slrow.off + .slider{opacity:.45;pointer-events:none}
.slrow .sl-val{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.slider{width:100%;height:20px;margin:0 0 12px;accent-color:var(--ink)}
.slider:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:999px}
.swrow{display:flex;align-items:center;gap:12px;min-height:44px}
.swrow .swlabel{flex:1}
.colorin{flex:none;width:34px;height:22px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.switch{flex:none;width:34px;height:20px;border:0;border-radius:99px;background:var(--sw-off);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel)}
.switch[aria-checked=true]{background:var(--ink)}
.switch[aria-checked=true]::after{left:auto;right:2px;background:var(--on)}
html[data-theme=dark] .switch::after{background:var(--faint)}
html[data-theme=dark] .switch[aria-checked=true]::after{background:var(--on)}
.off{color:var(--faint)}
.off .switch{opacity:.45}
.group-title{font-size:11px;color:var(--muted);margin-bottom:7px}
.swgroup{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:2px 12px}
.kbdrow{display:flex;align-items:center;justify-content:space-between;gap:8px;height:35px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:13px;cursor:pointer}
.kbdrow .keys{display:flex;gap:4px}
.kbdrow kbd{font-family:var(--f);font-size:11px;min-width:18px;height:19px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--text)}
.kbdrow.rec{border-color:var(--ink);color:var(--muted)}
.kbdrow.rec .keys{display:none}
.link-row{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 0;border:0;border-top:1px solid var(--line2);background:transparent;text-align:left;font-size:12.5px}
.link-row:hover{color:var(--ink)}
.link-row .chevm{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11px}
.link-row svg{width:15px;height:15px;flex:none;color:var(--muted)}
.upd{display:flex;align-items:center;gap:12px;min-height:56px}
.upd-main{flex:1;min-width:0}
.upd-now{font-size:13px}
.upd-state{font-size:11.5px;color:var(--muted);margin-top:2px;min-height:17px}
.about-foot{padding-top:24px;text-align:center;font-size:11px;color:var(--faint);line-height:1.7}
.about-foot .about-name{font-size:14px;font-weight:700;color:var(--text)}
.set-f{display:flex;align-items:center;gap:8px;padding:0 20px;min-height:56px;border-top:1px solid var(--line2);flex:none}
.btn{padding:6px 14px;border-radius:999px;border:1px solid transparent;font-size:12px;font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.ghost:disabled{color:var(--faint);cursor:default}
.btn.ink{background:var(--ink);color:var(--on)}
.btn.ink:disabled{opacity:.45;cursor:default}
.status{flex:1;text-align:center;font-size:11px;color:var(--faint)}
[hidden]{display:none!important}
/* 测试用的背景选择，只在液体主题出现，贴在视口左上角；它不属于设置，不进文档，也不影响保存状态。 */
.bgpick{position:fixed;top:12px;left:12px;z-index:10;display:flex;flex-direction:column;gap:6px;margin:0;padding:8px 12px 10px;border:1px solid #d6dae1;border-radius:10px;background:#fff;color:#1a1a1f;font:12px/1.2 var(--f)}
.bgpick legend{padding:0 4px;font-weight:700}
.bgpick label{display:flex;align-items:center;gap:6px;cursor:pointer}
</style>
</head>
<body>
<!-- 液体玻璃的位移滤镜，只做折射一步：位移图由 liquidMap() 按卡片尺寸画一次，强度（scale）由 applyTheme 写回。
     模糊与饱和在 CSS 的 backdrop-filter 里接在它之后。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="lg-liquid" filterUnits="userSpaceOnUse" x="0" y="0" width="380" height="480" color-interpolation-filters="sRGB">
    <feImage id="lg-map" x="0" y="0" width="380" height="480" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap id="lg-disp" in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>
<div class="settings" id="app" data-level="home">
  <div class="set-h">
    <button class="set-back" id="back" type="button" aria-label="返回">‹</button>
    <span class="set-title" id="title" data-l="title"></span>
    <span class="set-sep" id="crumb-sep" hidden aria-hidden="true">/</span>
    <span class="set-crumb" id="crumb" hidden></span>
    <button class="close" type="button" aria-label="关闭">×</button>
  </div>
  <div class="set-body" id="view"></div>
  <div class="set-f">
    <button class="btn ghost" id="defaults" type="button" disabled data-l="defaults"></button>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button class="btn ink" id="save" type="button" disabled data-l="save"></button>
  </div>
</div>
<fieldset class="bgpick" id="bgpick" hidden></fieldset>
<script>
/// The reader-facing strings, one column per language, taken from i18n/lens_*.ts so the
/// prototype and the application say the same thing. `cat` is the catalogue: one entry per
/// category, keyed by the id the routing already uses, name first and summary second. The
/// sub-pages behind the catalogue keep the Chinese they were drawn in.
const L = {
  en: { title: "Settings", defaults: "Defaults", save: "Save",
        cat: { general: ["General", "Theme, animations, launch at startup"],
               learning: ["Reading & learning", "Vocabulary level, explanation language, multiple senses, etymology, example sentences"],
               capture: ["Capture & popups", "Trigger channels"],
               model: ["Model service", "Provider, model, API configuration"],
               budget: ["Daily budget", "Limit model spending for one local day"],
               extensions: ["Extensions", "Desktop companion"],
               about: ["About", "Version, updates, repository"] },
        about: { repo: "GitHub repository", now: "Current version %1", check: "Check for updates",
                 states: { checking: "Checking...", latest: "Up to date (version %1)" },
                 copyright: "Copyright (c) 2026 kakuyo1 · MIT License", built: "Built %1" } },
  zh: { title: "设置", defaults: "恢复默认", save: "保存",
        cat: { general: ["通用", "主题、动画效果、开机自启"],
               learning: ["阅读学习", "词汇档位、解释语言、多义解释、词源、例句"],
               capture: ["取词与弹窗", "触发通道"],
               model: ["模型服务", "服务商、模型、API 配置"],
               budget: ["每日预算", "限制单个本地日的模型花费"],
               extensions: ["扩展", "桌面宠物"],
               about: ["关于", "版本、检查更新、仓库"] },
        about: { repo: "GitHub 仓库", now: "当前版本 %1", check: "检查更新",
                 states: { checking: "检查中…", latest: "已是最新（当前版本 %1）" },
                 copyright: "Copyright (c) 2026 kakuyo1 · MIT 许可证", built: "构建于 %1" } },
  ja: { title: "設定", defaults: "初期設定", save: "保存",
        cat: { general: ["一般", "テーマ、アニメーション、スタートアップ"],
               learning: ["読解と学習", "語彙レベル、解説の言語、複数の語義、語源、例文"],
               capture: ["取得とポップアップ", "取得のきっかけ"],
               model: ["モデルサービス", "プロバイダー、モデル、API 設定"],
               budget: ["1 日の予算", "1 日あたりのモデル費用を制限"],

/// 模糊改用百分制：100% 折成 60 px，与原来的像素上限一致。
const BLUR_PX = 0.6;
function applyTheme() {
  const root = document.documentElement;
  root.dataset.theme = values.theme;
  for (const prop of ["--bg", "--wall", "--panel", "--text", "--muted", "--faint", "--ink", "--on", "--glass-blur", "--glass-sat", "--glass-rim"]) root.style.removeProperty(prop);
  delete root.dataset.refract;
  if (values.theme === "custom") {
    root.style.setProperty("--bg", values.customBg);
    root.style.setProperty("--panel", values.customPanel);
    root.style.setProperty("--text", values.customText);
    root.style.setProperty("--muted", values.customMuted);
    root.style.setProperty("--faint", values.customFaint);
    root.style.setProperty("--ink", values.customOk);
    root.style.setProperty("--on", values.customPanel);
  } else if (values.theme === "frosted") {
    root.style.setProperty("--glass-blur", values.glassBlur * BLUR_PX + "px");
    root.style.setProperty("--glass-sat", values.glassSat + "%");
    root.style.setProperty("--glass-rim", values.glassRim / 100);
  } else if (values.theme === "liquid") {
    root.style.setProperty("--glass-blur", values.liquidBlur * BLUR_PX + "px");
    root.style.setProperty("--glass-rim", values.liquidRim / 100);
    // 字体颜色只改正文色；次要与弱字是同一色的半透明版本，层级仍由它们的色阶给出
    root.style.setProperty("--text", values.liquidText);
    root.style.setProperty("--muted", `color-mix(in srgb, ${values.liquidText} 82%, transparent)`);
    root.style.setProperty("--faint", `color-mix(in srgb, ${values.liquidText} 64%, transparent)`);
    if (refractOK) {
      root.dataset.refract = "on";
      svgAttr("lg-disp", "scale", values.liquidRefract);
    }
  }
  // 两套玻璃各用自己那组底图的当前一张
  const glass = values.theme === "frosted" || values.theme === "liquid";
  if (glass) root.style.setProperty("--wall", `url("${values.theme}-backdrops/${backdropOf[values.theme]}.png")`);
  // 测试背景单选按主题整组重画：同一套内拖滑块不动它，免得键盘焦点被重建掉
  bgpick.hidden = !glass;
  if (glass && bgpick.dataset.theme !== values.theme) {
    bgpick.dataset.theme = values.theme;
    bgpick.innerHTML = `<legend>测试背景</legend>` + BACKDROPS[values.theme].map(([id, label]) => `<label><input type="radio" name="bg" value="${id}"${id === backdropOf[values.theme] ? " checked" : ""}>${label}</label>`).join("");
  }
  // 派生读数跟着状态走，滑块拖到哪儿数字就是几
  for (const out of view.querySelectorAll("[data-out]")) out.textContent = values[out.dataset.out] + out.dataset.unit;
}

const CONTROLS = "button,input,textarea,select,a,[role=button],[role=switch]";
app.addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest(CONTROLS)) return;
  e.preventDefault();
  const r = app.getBoundingClientRect();
  drag = { id: e.pointerId, fromX: e.clientX, fromY: e.clientY, dx: dragOffset.x, dy: dragOffset.y,
           rest: { left: r.left - dragOffset.x, top: r.top - dragOffset.y, right: r.right - dragOffset.x, bottom: r.bottom - dragOffset.y } };
  app.setPointerCapture(e.pointerId);
  document.body.classList.add("dragging");
});
app.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const { rest } = drag, clamp = (v, lo, hi) => Math.min(Math.max(v, Math.min(lo, hi)), Math.max(lo, hi));
  dragOffset.x = clamp(drag.dx + e.clientX - drag.fromX, -rest.left, innerWidth - rest.right);
  dragOffset.y = clamp(drag.dy + e.clientY - drag.fromY, -rest.top, innerHeight - rest.bottom);
  app.style.setProperty("--drag-x", dragOffset.x + "px");
  app.style.setProperty("--drag-y", dragOffset.y + "px");
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null;
  document.body.classList.remove("dragging");
};
app.addEventListener("pointerup", endDrag);
app.addEventListener("pointercancel", endDrag);

document.getElementById("save").onclick = () => { saved = { ...values }; status = "已保存"; updateFoot(); };
defaultsBtn.onclick = () => { values = { ...defaults, api: values.api, url: values.url, provider: values.provider, model: values.model, startup: values.startup }; status = ""; render(); };
view.addEventListener("click", e => {
  const row = e.target.closest("[data-record]");
  if (row) { recording = row.dataset.record; render(); return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.classList.contains("dd-btn") || b.classList.contains("mf-go")) { const dd = b.closest(".dd"); const open = dd.classList.toggle("open"); b.setAttribute("aria-expanded", String(open)); return; }
  if (b.dataset.act === "check") { updState = "checking"; render(); setTimeout(() => { updState = "latest"; render(); }, 900); return; }
  if (b.dataset.act === "github") { window.open("https://github.com/kakuyo1/lens", "_blank"); return; }
  if (b.dataset.category) { category = b.dataset.category; route = null; render(true); return; }
  if (b.dataset.route) { route = b.dataset.route; render(true); return; }
  if (b.dataset.key) {
    values[b.dataset.key] = b.dataset.value; status = ""; render();
    const el = view.querySelector(`[data-key="${b.dataset.key}"][data-value="${b.dataset.value}"]`);
    if (el) (el.classList.contains("dd-item")
      ? (el.closest(".dd").querySelector(".dd-btn") || el.closest(".dd").querySelector(".mf-in"))
      : el).focus();
    return;
  }
  if (b.dataset.toggle) { const k = b.dataset.toggle; values[k] = !values[k]; status = ""; render(); return; }
});
view.addEventListener("input", e => { if (e.target.dataset.input) { values[e.target.dataset.input] = e.target.value; status = ""; applyTheme(); updateFoot(); } });
view.addEventListener("change", e => { if (e.target.dataset.input) { values[e.target.dataset.input] = e.target.value; status = ""; updateFoot(); } });
document.addEventListener("click", e => {
  if (e.target.closest(".dd")) return;
  view.querySelectorAll(".dd.open").forEach(d => {
    d.classList.remove("open");
    (d.querySelector(".dd-btn") || d.querySelector(".mf-go")).setAttribute("aria-expanded", "false");
  });
});
document.addEventListener("keydown", e => {
  // A combination needs Ctrl or Alt; a bare key would be taken from every other program on the
  // machine. A modifier on its own is not a combination yet -- the reader is on their way to the
  // key that follows it. Escape gives up the recording.
  if (recording) {
    e.preventDefault();
    if (e.key === "Escape") { recording = null; render(); return; }
    if (["Control", "Alt", "Shift", "Meta"].includes(e.key)) return;
    const held = [];
    if (e.ctrlKey) held.push("Ctrl");
    if (e.altKey) held.push("Alt");
    if (e.shiftKey) held.push("Shift");
    if (e.metaKey) held.push("Win");
    if (!held.includes("Ctrl") && !held.includes("Alt")) return;
    values[recording] = [...held, e.key.length === 1 ? e.key.toUpperCase() : e.key].join("+");
    recording = null;
    status = "";
    render();
    return;
  }
  if (e.key !== "Escape") return;
  const open = view.querySelector(".dd.open");
  if (open) { open.classList.remove("open"); const btn = open.querySelector(".dd-btn"); btn.setAttribute("aria-expanded", "false"); btn.focus(); return; }
  if (route || category) { e.preventDefault(); if (route) route = null; else category = null; render(true); }
});
/// 折射能力探测：不支持 url() 形式 backdrop-filter 的浏览器会丢掉这条声明，读回空串。此时液体玻璃退回 CSS 的模糊与高光。
const refractOK = (() => { const p = document.createElement("div"); p.style.backdropFilter = "url(#lg-liquid)"; return p.style.backdropFilter !== ""; })();
const svgAttr = (id, name, v) => document.getElementById(id).setAttribute(name, v);
/// 按卡片尺寸画一次位移图（R/G 编码到 [0,255]，128 为零位移）。位移取模糊后的圆角矩形遮罩的梯度：
/// 遮罩在边缘最陡、向中心趋于平坦，梯度处处连续，所以没有距离场那样沿对角线（两条边的等距线）翻转的接缝，不会画出 X 形。
/// 位移朝内取样：边缘的像素从玻璃里面借内容，边缘因此被压弯；位移的强度由 feDisplacementMap 的 scale 决定，不在这里烤死。
function liquidMap(W = 380, H = 480, R = 22, S = 18) {
  const mask = document.createElement("canvas");
  mask.width = W; mask.height = H;
  const mctx = mask.getContext("2d");
  mctx.filter = `blur(${S}px)`;
  mctx.fillStyle = "#fff";
  mctx.beginPath(); mctx.roundRect(0, 0, W, H, R); mctx.fill();
  const m = mctx.getImageData(0, 0, W, H).data;
  // 读 alpha：白色填充的 RGB 恒为 255，模糊后的梯度只在 alpha 里
  const at = (x, y) => m[(Math.min(Math.max(y, 0), H - 1) * W + Math.min(Math.max(x, 0), W - 1)) * 4 + 3] / 255;
  // 遮罩向内升高，中心差分即朝内的梯度；按全图最大值归一，最强处正好编码到 127
  const gx = new Float32Array(W * H), gy = new Float32Array(W * H);
  let max = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    gx[i] = (at(x + 1, y) - at(x - 1, y)) / 2;
    gy[i] = (at(x, y + 1) - at(x, y - 1)) / 2;
    max = Math.max(max, Math.hypot(gx[i], gy[i]));
  }
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d"), img = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) img.data.set([128 + 127 * gx[i] / max, 128 + 127 * gy[i] / max, 128, 255], i * 4);
  ctx.putImageData(img, 0, 0);
  return canvas.toDataURL();
}
if (refractOK) svgAttr("lg-map", "href", liquidMap());
render();
